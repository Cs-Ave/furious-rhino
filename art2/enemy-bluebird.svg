<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36" width="60" height="36">
  <!-- FURIOUS RHINO - proposta bioma savana (em avaliacao, nao usada pelo jogo).
       Ave azul de rasante chibi: corpo compacto inclinado em mergulho (~15 graus),
       penacho para tras, sobrancelha brava, asas pontudas de andorinha, cauda bifurcada,
       tracinhos de vento atras. hitbox sugerida: 40x16 em offset 16,11.
       Entre frames so as asas mudam (erguidas <-> abaixadas), como o par eagle/flap. -->
  <defs>
    <linearGradient id="bbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7de0"/>
      <stop offset="1" stop-color="#1a4fa8"/>
    </linearGradient>
    <radialGradient id="bbHead" cx="0.42" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#63a4ec"/>
      <stop offset="1" stop-color="#2e7de0"/>
    </radialGradient>
  </defs>
  <!-- tracinhos de vento (velocidade) -->
  <path d="M2 8 L12 10.2" fill="none" stroke="#a9c6e8" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M1 13.5 L13.5 16" fill="none" stroke="#a9c6e8" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M3 19.5 L11.5 21" fill="none" stroke="#a9c6e8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- asa distante erguida -->
  <path d="M35 12.5 Q28 4.5 14 2 L21.5 6.8 Q16.5 6.8 13 8.4 L24 10.4 Q31 12 37 15.5 Z" fill="#16408c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- cauda bifurcada de andorinha -->
  <path d="M24 13.5 L7 3.5 L16.5 12 Z" fill="#16408c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24.5 18 L4.5 11 L15.5 15.6 Z" fill="#16408c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M21 14.6 L10 8 M21.5 16.6 L9 12.4" fill="none" stroke="#0e2f6b" stroke-width="1" stroke-linecap="round"/>
  <!-- corpo inclinado em mergulho -->
  <ellipse cx="31" cy="17.5" rx="12.5" ry="7" transform="rotate(14 31 17.5)" fill="url(#bbBody)" stroke="#17171b" stroke-width="2.4"/>
  <ellipse cx="30.5" cy="20.5" rx="8.5" ry="2.8" transform="rotate(14 31 17.5)" fill="#123a7d" opacity="0.5"/>
  <path d="M21 12.5 Q31 9.5 41 15.5" fill="none" stroke="#6fa8ef" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- barriga clara -->
  <path d="M25 22.5 Q32 25.8 40 24.2 Q34 27.4 27.5 25.6 Z" fill="#9dc6f2" opacity="0.9"/>
  <!-- asa proxima erguida (pontuda de andorinha) -->
  <path d="M40 11.5 Q33 2.5 18 0.8 Q11 0.5 6.5 2.4 L15.5 5.4 Q11 6.2 8 8.8 L18.5 8.8 Q28 10.2 37.5 14.8 Q41 14 40 11.5 Z" fill="url(#bbBody)" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M36 12.5 Q27 6.5 17 4.6" fill="none" stroke="#143d85" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M34 13.8 Q26 9.8 18 8.2" fill="none" stroke="#143d85" stroke-width="1" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="45.5" cy="19.5" r="7.2" fill="url(#bbHead)" stroke="#17171b" stroke-width="2.4"/>
  <path d="M41 15.5 Q44 13.4 47.5 13.8" fill="none" stroke="#8fc0f2" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- penacho curto para tras -->
  <path d="M41.5 13.6 Q37.6 10.8 34 11.2 L38 13.6 Q35.6 14 34 15.6 L39 15.2 Q40.8 15.2 41.8 16 Z" fill="#16408c" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- sobrancelha brava -->
  <path d="M42.6 15.4 L49.4 17.8" fill="none" stroke="#17171b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- olho -->
  <circle cx="47.8" cy="19.8" r="2.3" fill="#17171b"/>
  <circle cx="47.1" cy="19.1" r="0.7" fill="#ffffff"/>
  <!-- bochecha clara -->
  <ellipse cx="44.6" cy="23.4" rx="3" ry="2" fill="#8fc0f2" opacity="0.8"/>
  <!-- bico curto pontudo, levemente para baixo -->
  <path d="M51.8 20.2 L58.6 23.4 L51.4 25.4 Z" fill="#3a3a41" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M52.2 22.6 L56.6 23.4" fill="none" stroke="#17171b" stroke-width="1" stroke-linecap="round"/>
  <circle cx="52.8" cy="21.4" r="0.5" fill="#1d1d22"/>
</svg>
