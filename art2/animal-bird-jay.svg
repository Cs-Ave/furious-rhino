<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 32" width="56" height="32">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Azulao de topete chibi no canvas comum 56x32 dos passaros. -flap so muda a asa. -->
  <defs>
    <linearGradient id="jy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63a0f2"/>
      <stop offset="1" stop-color="#3f7cd6"/>
    </linearGradient>
  </defs>
  <!-- cauda (2 camadas) -->
  <path d="M14 15.5 L6.3 10.5 L10 16 L6.5 20.5 Z" fill="#3a6fc0" stroke="#17171b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M13.5 14.5 L8.5 11.5 L11 15.5 Z" fill="#5c94e8"/>
  <!-- corpo -->
  <ellipse cx="26" cy="18.5" rx="12.5" ry="9" fill="url(#jy)" stroke="#17171b" stroke-width="2.2"/>
  <ellipse cx="29" cy="22" rx="7.5" ry="4.5" fill="#ffffff"/>
  <path d="M23 25.2 Q25.5 26.8 28.5 27 M31.5 26.8 Q34.5 26.4 36.5 25" fill="none" stroke="#d9e4f6" stroke-width="1" stroke-linecap="round"/>
  <!-- asa levantada (faixa branca) -->
  <path d="M22 15 Q16 3.5 30 5 Q34 9 28 16 Z" fill="#3568b8" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M23.7 13.2 Q20.5 8.4 25.3 6.4" fill="none" stroke="#f2f3f6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M27 13.6 Q24.5 9 29 6.8" fill="none" stroke="#2c5ca6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- topete azul (2 penas) -->
  <path d="M34.1 5.4 Q31.5 0.9 30.1 3.2 Q32.5 3.8 33.1 6.2 Z" fill="#3f7cd6" stroke="#17171b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M36.5 4.4 Q34.9 0.8 32.5 1.4 Q34.9 2.6 35.3 5.2 Z" fill="#3f7cd6" stroke="#17171b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- cabeca -->
  <circle cx="39" cy="11.5" r="8" fill="url(#jy)" stroke="#17171b" stroke-width="2.2"/>
  <ellipse cx="37.3" cy="14" rx="2" ry="1.4" fill="#8ab6f6" opacity="0.75"/>
  <circle cx="41" cy="10.3" r="2.6" fill="#17171b"/>
  <circle cx="40.2" cy="9.5" r="0.85" fill="#ffffff"/>
  <!-- bico -->
  <path d="M45.3 10.3 L49.3 12.4 L45.3 14.4 Z" fill="#f5a623" stroke="#c47f10" stroke-width="1" stroke-linejoin="round"/>
  <path d="M45.9 12.3 L48.5 12.4" stroke="#c47f10" stroke-width="0.7"/>
</svg>
