<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 68" width="48" height="68">
  <!-- FURIOUS RHINO - proposta bioma jaulas (em avaliacao, nao usada pelo jogo).
       Tratador de zoo chibi REFEITO DO ZERO correndo atras do rino: cabecao,
       chapeu de safari bege, uniforme verde-oliva com bolso, cinto e distintivo,
       gritando de esforco. A rede de captura agora aponta PARA FRENTE: cabo de
       madeira atravessado no peito (punho atras, ponta na frente embaixo) e aro
       cinza com malha na frente do corpo, pronto para o bote; bracos em curva
       unica estilo pedestre em panico, maos de pele segurando o cabo.
       hitbox sugerida: 32x52 em offset 8,14 (aro da rede e aba do chapeu em
       grande parte fora da hitbox).
       Entre os frames mudam SO: (1) as pernas trocam de fase (dianteira e
       traseira invertem) e (2) o grupo da rede (cabo + malha + aro + saco)
       ganha transform rotate(-6 29.3 42.9), pivo na mao da frente, balancando
       com a passada; todo o resto e byte-identico. -->
  <defs>
    <linearGradient id="zku" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9a4c"/>
      <stop offset="1" stop-color="#66752f"/>
    </linearGradient>
    <linearGradient id="zkh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eedbb0"/>
      <stop offset="1" stop-color="#cdb27b"/>
    </linearGradient>
    <radialGradient id="zkf" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f8cfa4"/>
      <stop offset="1" stop-color="#eaa96f"/>
    </radialGradient>
  </defs>
  <!-- linhas de velocidade -->
  <path d="M1.5 38 L7 38 M2.5 44 L8.5 44" fill="none" stroke="#b8c29a" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <!-- pernas em passada -->
  <g transform="rotate(-14 21 50)">
    <rect x="17.5" y="48.5" width="7" height="14" rx="3" fill="#5d6b2c" stroke="#17171b" stroke-width="2"/>
    <rect x="16.8" y="61.2" width="8.4" height="5.2" rx="2.2" fill="#6b4a22" stroke="#5a3a10" stroke-width="1.8"/>
  </g>
  <g transform="rotate(38 27 50)">
    <rect x="23.5" y="48.5" width="7" height="14" rx="3" fill="#6f7f37" stroke="#17171b" stroke-width="2"/>
    <rect x="22.8" y="61.2" width="8.4" height="5.2" rx="2.2" fill="#7d5628" stroke="#5a3a10" stroke-width="1.8"/>
  </g>
  <!-- tronco do uniforme -->
  <ellipse cx="24" cy="41" rx="13" ry="11.5" fill="url(#zku)" stroke="#17171b" stroke-width="2.5"/>
  <ellipse cx="23" cy="46.5" rx="9" ry="4.5" fill="#4f5c26" opacity="0.5"/>
  <path d="M14 36 Q24 29.5 34 35.5" fill="none" stroke="#a7b566" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- gola -->
  <path d="M17.5 31.5 L24 35 L30.5 31 L28.5 29.8 L24 32.4 L19.5 30.2 Z" fill="#78883c" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- bolso -->
  <rect x="15.5" y="39" width="6" height="5.4" rx="1" fill="#78883c" stroke="#17171b" stroke-width="1.4"/>
  <path d="M15.1 39.4 L22 39.4 L21.3 41.2 L15.8 41.2 Z" fill="#5d6b2c" stroke="#17171b" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="18.6" cy="42.8" r="0.7" fill="#d8c68f"/>
  <!-- distintivo -->
  <circle cx="30.5" cy="38.5" r="3" fill="#f0b73a" stroke="#17171b" stroke-width="1.6"/>
  <circle cx="30.5" cy="38.5" r="1.4" fill="#d9971e"/>
  <circle cx="29.6" cy="37.6" r="0.6" fill="#ffffff"/>
  <!-- cinto -->
  <rect x="14" y="48.4" width="20" height="4" rx="1.5" fill="#6b4a22" stroke="#5a3a10" stroke-width="1.8"/>
  <rect x="21.8" y="48.8" width="4.4" height="3.2" rx="0.8" fill="#d9d9de" stroke="#17171b" stroke-width="1.2"/>
  <!-- grupo da rede APONTADA PARA FRENTE: cabo + malha + aro + saco (anima junto entre frames) -->
  <g transform="rotate(-6 29.3 42.9)">
  <!-- cabo de madeira atravessado no peito, ponta na frente embaixo -->
  <path d="M14 33 L37.5 48.2" fill="none" stroke="#5a3a10" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 33 L37.5 48.2" fill="none" stroke="#a5691f" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 35.2 L19.6 37" fill="none" stroke="#5a3a10" stroke-width="1.2" stroke-linecap="round"/>
  <!-- malha da rede -->
  <ellipse cx="39.2" cy="49.6" rx="5.2" ry="6.3" transform="rotate(-57 39.2 49.6)" fill="#eef3f8" fill-opacity="0.3"/>
  <path d="M35.6 46.4 L43.6 48.4 M34.8 49.6 L44.6 51.2 M35.6 53 L43.6 54.4" fill="none" stroke="#b9c2cc" stroke-width="0.7"/>
  <path d="M37.2 44.6 L36 54.2 M40.2 44.4 L39.4 55.4 M43.2 45.8 L42.4 53.8" fill="none" stroke="#b9c2cc" stroke-width="0.7"/>
  <!-- aro cinza na frente -->
  <ellipse cx="39.2" cy="49.6" rx="5.2" ry="6.3" transform="rotate(-57 39.2 49.6)" fill="none" stroke="#17171b" stroke-width="3.2"/>
  <ellipse cx="39.2" cy="49.6" rx="5.2" ry="6.3" transform="rotate(-57 39.2 49.6)" fill="none" stroke="#aab2bc" stroke-width="1.6"/>
  <!-- saco da rede arrastando atras do aro -->
  <path d="M34.4 52.4 Q37.2 58.4 43.6 54" fill="none" stroke="#8f98a3" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M35.8 53.4 Q38 56.6 42 54.4" fill="none" stroke="#b9c2cc" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  <!-- bracos em curva unica (estilo pedestre), maos de pele no cabo -->
  <path d="M16 35 Q17.5 37.8 20 37.4" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M16 35 Q17.5 37.8 20 37.4" fill="none" stroke="#5d6b2c" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="20.6" cy="37.3" r="2.9" fill="url(#zkf)" stroke="#17171b" stroke-width="1.7"/>
  <path d="M27 34 Q30.5 37.5 29.5 42" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M27 34 Q30.5 37.5 29.5 42" fill="none" stroke="#6f7f37" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="29.3" cy="42.9" r="2.9" fill="url(#zkf)" stroke="#17171b" stroke-width="1.7"/>
  <!-- orelha -->
  <circle cx="9.2" cy="21" r="2.7" fill="#eaa96f" stroke="#17171b" stroke-width="1.8"/>
  <!-- cabeca -->
  <circle cx="20" cy="19.5" r="11.5" fill="url(#zkf)" stroke="#17171b" stroke-width="2.5"/>
  <!-- costeleta -->
  <path d="M9.2 14.5 Q8.3 18.5 9.8 22.5 Q12 19.5 11.3 14.8 Z" fill="#6b4a22" stroke="#17171b" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- rosto de esforco -->
  <path d="M14.5 14.6 L20.3 16.8" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29.6 14 L24.2 16.4" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18" cy="19.4" r="2.5" fill="#17171b"/>
  <circle cx="26" cy="19" r="2.5" fill="#17171b"/>
  <circle cx="18.7" cy="18.6" r="0.8" fill="#ffffff"/>
  <circle cx="26.7" cy="18.2" r="0.8" fill="#ffffff"/>
  <ellipse cx="13.5" cy="23" rx="2" ry="1.3" fill="#e58a5a" opacity="0.6"/>
  <circle cx="22.6" cy="22.6" r="1.7" fill="#e09b63" stroke="#b5713c" stroke-width="1"/>
  <!-- boca aberta gritando -->
  <ellipse cx="23.5" cy="27" rx="4.2" ry="3.2" fill="#7c221a" stroke="#17171b" stroke-width="1.6"/>
  <rect x="21.3" y="24.4" width="4.4" height="1.5" rx="0.6" fill="#ffffff"/>
  <ellipse cx="23.5" cy="28.8" rx="2.4" ry="1.3" fill="#e2574d"/>
  <!-- gota de suor -->
  <path d="M4.6 15.6 Q6.3 18.3 4.7 19.8 Q3 18.2 4.6 15.6 Z" fill="#9ed4f2"/>
  <!-- chapeu de safari -->
  <path d="M10 10.2 Q11 2 20 2 Q29 2 30 10.2 Z" fill="url(#zkh)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M11.2 9.4 Q20 6.8 28.8 9.4 L28.4 7.2 Q20 4.9 11.6 7.2 Z" fill="#6b7a35" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="20" cy="10.6" rx="13.5" ry="4.1" fill="url(#zkh)" stroke="#17171b" stroke-width="2.2"/>
  <path d="M8.5 10.4 Q20 13.2 31.5 10.4" fill="none" stroke="#b39a63" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
