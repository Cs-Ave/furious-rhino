<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 26" width="72" height="26">
  <!-- FURIOUS RHINO - proposta bioma floresta (em avaliacao, nao usada pelo jogo).
       Cobra rasteira chibi que obriga o rino a pular: corpo verde em 3 ondulacoes,
       barriga amarelada com placas, cabeca erguida a direita com lingua bifurcada,
       chocalho a esquerda; barriga quase na borda inferior.
       hitbox sugerida: 60x14 em offset 8,10.
       Entre frames (-alt) so as ondulacoes do corpo e o padrao do dorso trocam de fase
       (cristas viram vales); cabeca, lingua, barriga e chocalho ficam parados. -->
  <defs>
    <linearGradient id="snBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a83c"/>
      <stop offset="1" stop-color="#3d7a28"/>
    </linearGradient>
  </defs>
  <!-- chocalho -->
  <rect x="1.2" y="20.6" width="3.4" height="3.8" rx="1.5" fill="#cdb25e" stroke="#17171b" stroke-width="1.8"/>
  <rect x="4.4" y="21" width="3" height="3.4" rx="1.4" fill="#c2a854" stroke="#17171b" stroke-width="1.8"/>
  <path d="M2.9 21.4 L2.9 23.6 M5.9 21.8 L5.9 23.6" fill="none" stroke="#8a763a" stroke-width="0.9" stroke-linecap="round"/>
  <!-- ponta fina da cauda -->
  <path d="M7.2 23.2 Q9.5 22.4 11.5 23.2" fill="none" stroke="#17171b" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M7.2 23.2 Q9.5 22.4 11.5 23.2" fill="none" stroke="#4e9636" stroke-width="1.8" stroke-linecap="round"/>
  <!-- corpo em 3 ondulacoes (muda entre frames) -->
  <path d="M10 24.4
           C11.5 16.5 14 13.6 17.5 13.9
           C21.5 14.3 23 19.4 25.5 20.3
           C27.5 21 28.5 14.6 32.5 13.9
           C36.5 13.3 38 19.6 40.5 20.4
           C42.5 21 43.5 14.6 47.5 14.1
           L51 14.5
           L52.5 24.6
           Q30 24.9 10 24.4 Z"
        fill="url(#snBody)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- losangos e manchas do dorso (mudam entre frames) -->
  <path d="M17.5 14.6 L20 16.4 L17.5 18.2 L15 16.4 Z" fill="#2f6220" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M32.5 14.6 L35 16.4 L32.5 18.2 L30 16.4 Z" fill="#2f6220" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M47 15 L49 16.6 L47 18.2 L45 16.6 Z" fill="#2f6220" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="25.5" cy="22.2" r="0.9" fill="#2f6220"/>
  <circle cx="40.5" cy="22.2" r="0.9" fill="#2f6220"/>
  <!-- brilho das cristas (muda entre frames) -->
  <path d="M14.5 15.8 Q16 14.7 18 14.9 M29.5 15.8 Q31 14.7 33 14.9" fill="none" stroke="#8cc86a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- barriga amarelada com placas -->
  <path d="M12 23.2 Q32 23.9 50 22.8" fill="none" stroke="#ddc76a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M15 23.5 h2.4 M20 23.7 h2.4 M25 23.8 h2.4 M30 23.9 h2.4 M35 23.9 h2.4 M40 23.7 h2.4 M45 23.4 h2.4" fill="none" stroke="#b9a244" stroke-width="1" stroke-linecap="round"/>
  <!-- pescoco erguido -->
  <path d="M47.5 24.6 C48.2 20 49.6 15.4 54 11.6 L59.5 16.8 C56 19.6 54.6 22 54.4 24.6 Z" fill="url(#snBody)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M50.5 22.6 Q51.6 18.6 54.2 15.6" fill="none" stroke="#ddc76a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M51 21 l2 0.5 M52 18.4 l1.9 0.7" fill="none" stroke="#b9a244" stroke-width="0.9" stroke-linecap="round"/>
  <!-- cabeca -->
  <ellipse cx="59" cy="10.5" rx="8.6" ry="6.6" fill="url(#snBody)" stroke="#17171b" stroke-width="2.2"/>
  <path d="M52.5 8 Q58 4.6 64 6.8" fill="none" stroke="#7fbf5f" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="53.8" cy="12.6" r="1" fill="#2f6220"/>
  <!-- olhos grandes -->
  <circle cx="57.5" cy="8.4" r="3.1" fill="#cdd455" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="63.5" cy="8.4" r="3.1" fill="#cdd455" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="57.8" cy="8.5" r="1.9" fill="#17171b"/>
  <circle cx="63.8" cy="8.5" r="1.9" fill="#17171b"/>
  <circle cx="57" cy="7.6" r="0.75" fill="#ffffff"/>
  <circle cx="63" cy="7.6" r="0.75" fill="#ffffff"/>
  <!-- narina e boca -->
  <circle cx="66" cy="11.4" r="0.5" fill="#17171b"/>
  <path d="M64.5 14.2 Q66.6 14 67.4 13" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M55 13.4 Q58.5 14.4 62 13.8" fill="none" stroke="#2f6220" stroke-width="0.9" stroke-linecap="round"/>
  <!-- lingua bifurcada -->
  <path d="M66.8 12.6 Q69.4 12.9 70.4 12.2 M70.4 12.2 L71.4 11 M70.4 12.2 L71.5 13.1" fill="none" stroke="#d93025" stroke-width="1.3" stroke-linecap="round"/>
</svg>
