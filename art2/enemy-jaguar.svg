<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 46" width="80" height="46">
  <!-- FURIOUS RHINO - proposta bioma floresta (em avaliacao, nao usada pelo jogo).
       Onca-pintada chibi em corrida alongada (quase bote): corpo dourado comprido e baixo,
       rosetas pretas, cauda com ponta anelada, olhando para a direita.
       hitbox sugerida: 64x30 em offset 10,14.
       Entre frames so as pernas trocam de fase (galope invertido); o resto e identico. -->
  <defs>
    <linearGradient id="jgBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b13c"/>
      <stop offset="1" stop-color="#c68a1e"/>
    </linearGradient>
    <radialGradient id="jgFace" cx="0.45" cy="0.38" r="0.78">
      <stop offset="0" stop-color="#f0c162"/>
      <stop offset="1" stop-color="#d99a28"/>
    </radialGradient>
  </defs>
  <!-- cauda longa com ponta anelada -->
  <path d="M14 26 Q5 24 3 15" fill="none" stroke="#5a3a10" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M14 26 Q5 24 3 15" fill="none" stroke="#e0a835" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M4.4 19.5 Q3.5 18.4 3.2 16.9 M6.8 22.7 Q5.5 21.8 4.8 20.7" fill="none" stroke="#241605" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="3" cy="14" r="2.2" fill="#241605" stroke="#5a3a10" stroke-width="1"/>
  <!-- pernas do fundo, mais escuras (mudam entre frames) -->
  <g transform="rotate(38 18 33)">
    <rect x="15.2" y="30" width="5.6" height="12.6" rx="2.6" fill="#cf9224" stroke="#5a3a10" stroke-width="2"/>
    <ellipse cx="18" cy="41.8" rx="3.1" ry="2.2" fill="#b87c1a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <g transform="rotate(-34 49 33)">
    <rect x="46.2" y="30" width="5.6" height="12.6" rx="2.6" fill="#cf9224" stroke="#5a3a10" stroke-width="2"/>
    <ellipse cx="49" cy="41.8" rx="3.1" ry="2.2" fill="#b87c1a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <!-- corpo comprido e baixo -->
  <ellipse cx="35" cy="31" rx="23" ry="10.5" fill="url(#jgBody)" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- barriga creme -->
  <ellipse cx="34" cy="36.5" rx="16" ry="4.8" fill="#f4e3b2"/>
  <!-- sombra da barriga -->
  <ellipse cx="33" cy="38.8" rx="12" ry="2.6" fill="#a8791c" opacity="0.5"/>
  <!-- brilho do lombo -->
  <path d="M16 26.5 Q33 19 52 24.5" fill="none" stroke="#f2c869" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- rosetas -->
  <path d="M18.1 27.4 Q18.9 25.6 21 26 M21.9 27.2 Q22 29.2 20 29.8 M18.3 29.3 Q17.8 28.7 17.9 28.2" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="20" cy="27.9" r="0.75" fill="#241605"/>
  <path d="M25.2 24.4 Q25.9 22.8 27.8 23.2 M28.8 24.4 Q28.6 26.2 26.6 26.2" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="27" cy="24.6" r="0.7" fill="#241605"/>
  <path d="M24.7 32.6 Q25.4 31 27.4 31.4 M28.3 32.8 Q28 34.6 26 34.4" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="26.5" cy="32.9" r="0.7" fill="#241605"/>
  <path d="M32 29.3 Q32.6 27.5 34.8 27.9 M35.8 29.3 Q35.6 31.3 33.4 31.2" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="34" cy="29.5" r="0.75" fill="#241605"/>
  <path d="M39.2 24.8 Q39.8 23.2 41.8 23.5 M42.7 24.8 Q42.5 26.6 40.4 26.5" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="41" cy="25" r="0.7" fill="#241605"/>
  <path d="M41.7 33.3 Q42.3 31.7 44.3 32 M45.2 33.3 Q45 35.1 42.9 35" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="43.5" cy="33.4" r="0.7" fill="#241605"/>
  <path d="M48.2 28.3 Q48.8 26.6 50.9 27 M51.8 28.3 Q51.6 30.1 49.4 30" fill="none" stroke="#241605" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="50" cy="28.4" r="0.7" fill="#241605"/>
  <circle cx="15.5" cy="30.5" r="0.9" fill="#241605"/>
  <circle cx="47.5" cy="22.6" r="0.8" fill="#241605"/>
  <!-- pernas da frente do quadro (mudam entre frames) -->
  <g transform="rotate(24 24 33)">
    <rect x="21" y="30" width="6.2" height="13.4" rx="2.8" fill="#e8b13c" stroke="#5a3a10" stroke-width="2"/>
    <ellipse cx="24.1" cy="43" rx="3.4" ry="2.4" fill="#d99c26" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <g transform="rotate(-20 55 33)">
    <rect x="52" y="30" width="6.2" height="13.4" rx="2.8" fill="#e8b13c" stroke="#5a3a10" stroke-width="2"/>
    <ellipse cx="55.1" cy="43" rx="3.4" ry="2.4" fill="#d99c26" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <!-- tufo do peito -->
  <path d="M52 28.5 L50.4 30 L52.3 30.8 L50.8 32.3" fill="none" stroke="#5a3a10" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- orelhas redondas com miolo -->
  <circle cx="54" cy="7" r="4" fill="#d99a28" stroke="#5a3a10" stroke-width="2"/>
  <circle cx="54.2" cy="7.3" r="1.8" fill="#8a5a14"/>
  <circle cx="69.5" cy="6.5" r="4" fill="#e8b13c" stroke="#5a3a10" stroke-width="2"/>
  <circle cx="69.3" cy="6.8" r="1.8" fill="#8a5a14"/>
  <!-- cabeca redonda com bochechas -->
  <circle cx="62" cy="18" r="12.5" fill="url(#jgFace)" stroke="#5a3a10" stroke-width="2.5"/>
  <path d="M50.6 21.5 L48.6 22.6 L50.4 23.6 L48.8 24.8 L50.9 25.4" fill="none" stroke="#5a3a10" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pintas da testa -->
  <circle cx="56.5" cy="10.2" r="0.7" fill="#241605"/>
  <circle cx="60.5" cy="8.6" r="0.65" fill="#241605"/>
  <circle cx="65.5" cy="9.4" r="0.7" fill="#241605"/>
  <!-- sobrancelhas -->
  <path d="M54.5 12.6 Q57 11.2 59.4 12.2 M64.4 11.8 Q66.9 10.6 69.4 11.8" fill="none" stroke="#8a5a14" stroke-width="1.2" stroke-linecap="round"/>
  <!-- olhos verdes-amarelados -->
  <circle cx="57.2" cy="15.4" r="2.9" fill="#cede4a" stroke="#5a3a10" stroke-width="1"/>
  <circle cx="67.5" cy="14.8" r="2.9" fill="#cede4a" stroke="#5a3a10" stroke-width="1"/>
  <circle cx="57.4" cy="15.5" r="1.5" fill="#17171b"/>
  <circle cx="67.7" cy="14.9" r="1.5" fill="#17171b"/>
  <circle cx="56.7" cy="14.7" r="0.7" fill="#ffffff"/>
  <circle cx="67" cy="14.1" r="0.7" fill="#ffffff"/>
  <!-- focinho branco -->
  <ellipse cx="66.5" cy="23.5" rx="7.2" ry="5.4" fill="#f8eed6" stroke="#5a3a10" stroke-width="1.8"/>
  <!-- nariz rosado e boca -->
  <path d="M64.9 20.6 Q66.8 19.6 68.7 20.6 Q66.8 23.4 64.9 20.6 Z" fill="#e2758d" stroke="#5a3a10" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M66.8 23.2 L66.8 24.6 M66.8 24.6 Q64.6 26.6 62.8 25.2 M66.8 24.6 Q69 26.6 70.8 25.2" fill="none" stroke="#5a3a10" stroke-width="1.3" stroke-linecap="round"/>
  <!-- bigodes -->
  <path d="M60.5 23.5 Q57.5 23 56 21.8 M60.5 25 Q57.5 25 55.8 24.2" fill="none" stroke="#8a6a3a" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M72.5 22.5 Q75.5 21.8 77 20.5 M72.8 24.2 Q75.8 24.2 77.6 23.4" fill="none" stroke="#8a6a3a" stroke-width="0.9" stroke-linecap="round"/>
</svg>
