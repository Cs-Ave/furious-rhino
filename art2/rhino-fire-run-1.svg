<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <!-- FURIOUS RHINO - proposta especial FURIA TOTAL (em avaliacao, nao usada pelo jogo).
       Silhueta, pose e ciclo de pernas IDENTICOS ao art/rhino-run-1.svg: corpo, cabeca, chifre,
       cauda, as pernas em apoio e o bob de 2px usam a mesma geometria do frame 1
       (hitbox do jogo 76x54 offset 8,10 inalterada).
       O que muda e o tratamento: pele chumbo/grafite com veios de lava, olho em brasa, ponta do
       chifre incandescente, chamas em 3 camadas no dorso/nuca/cauda e brasas soltas.
       Entre frames: pernas seguem o ciclo original (0 -> 1 -> 2); chamas ondulam em fase propria
       (mesma quantidade de linguas, pontas em posicoes diferentes) e as brasas mudam de lugar. -->
  <defs>
    <linearGradient id="rfb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4e55"/>
      <stop offset="0.55" stop-color="#453b43"/>
      <stop offset="1" stop-color="#2b2530"/>
    </linearGradient>
    <linearGradient id="rfh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#564a53"/>
      <stop offset="1" stop-color="#342d39"/>
    </linearGradient>
    <linearGradient id="rfho" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ecd5a2"/>
      <stop offset="0.55" stop-color="#f4b25a"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </linearGradient>
    <linearGradient id="rff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f28"/>
      <stop offset="1" stop-color="#f2601a"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 2)">
