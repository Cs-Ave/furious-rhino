    <rect x="49" y="57.4" width="3.6" height="3.4" rx="1.3" fill="#ecc98d" stroke="#14161a" stroke-width="1"/>
    <rect x="53.4" y="57.4" width="3.6" height="3.4" rx="1.3" fill="#ecc98d" stroke="#14161a" stroke-width="1"/>
