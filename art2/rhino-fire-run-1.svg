    <circle cx="76.5" cy="25" r="3" fill="#ffa63c" stroke="#14161a" stroke-width="1.2"/>
    <circle cx="77.5" cy="25.4" r="1.5" fill="#e03c00"/>
    <circle cx="76" cy="24.2" r="0.55" fill="#ffffff"/>
    <path d="M71 21 Q76.5 18.8 82 23.5" fill="none" stroke="#14161a" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M81.5 22.5 Q83 24.6 82.7 26.8" fill="none" stroke="#6b5b63" stroke-width="1.5" stroke-linecap="round"/>
