    <circle cx="2.2" cy="18" r="0.7" fill="#ff9b4a" opacity="0.8"/>
    <circle cx="20.5" cy="1.4" r="0.7" fill="#ffc93c" opacity="0.75"/>
    <!-- chama da cauda (fase 1) -->
