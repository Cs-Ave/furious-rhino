    <path d="M55.8 8 Q55 3.6 58.4 2 Q60.2 4.8 59 8.2 Q60.8 7 61.8 9 Q60.8 11.2 58.2 11.2 Q56.1 10.2 55.8 8 Z" fill="url(#rff)" stroke="#14161a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M57.2 6.6 Q57 4.2 58.8 3.8 Q59.6 5.8 58.6 7.8 Q57.6 7.7 57.2 6.6 Z" fill="#ffc93c"/>
