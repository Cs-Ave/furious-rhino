<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 32" width="56" height="32">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Tucano chibi 56x32: identico ao frame base, asa para baixo. -->
  <defs>
    <linearGradient id="tk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#24242c"/>
    </linearGradient>
    <linearGradient id="tkb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c53a"/>
      <stop offset="1" stop-color="#ef8f2a"/>
    </linearGradient>
  </defs>
  <!-- cauda preta com ponta vermelha -->
  <path d="M15 14 L7.5 18.5 L14 21 Z" fill="#2e2e36" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M11 16.5 L7.5 18.7 L11.5 19.8 Z" fill="#d23b2f"/>
  <!-- corpo -->
  <ellipse cx="26" cy="18.5" rx="12.5" ry="9" fill="url(#tk)" stroke="#17171b" stroke-width="2.2"/>
  <!-- peito branco -->
  <ellipse cx="31" cy="19.5" rx="6.5" ry="5.5" fill="#f6f1e6"/>
  <!-- asa abaixada -->
  <path d="M22 20.5 Q16 30.5 30 29.5 Q34 25.5 28 18.5 Z" fill="#24242c" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24.5 22.5 Q21 28 26 29.5" fill="none" stroke="#5a5a68" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="39" cy="11.5" r="8" fill="url(#tk)" stroke="#17171b" stroke-width="2.2"/>
  <!-- face branca + olho -->
  <ellipse cx="38.3" cy="12" rx="5.8" ry="6.2" fill="#f6f1e6"/>
  <circle cx="37.7" cy="10.4" r="3" fill="#a8d0f0"/>
  <circle cx="37.7" cy="10.4" r="2.2" fill="#17171b"/>
  <circle cx="36.9" cy="9.6" r="0.8" fill="#ffffff"/>
  <!-- bicao comprido para frente -->
  <path d="M42.6 7.5 Q52 6.7 54.4 10.7 Q55.5 13.6 52.9 16.3 Q50.1 18.7 44.9 17.3 L42.8 15.7 Q45.6 11.9 42.7 9.4 Z" fill="url(#tkb)" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M53.3 9.7 Q54.9 12.6 53.4 15.5 L51.7 14.4 Q52.8 12.3 52.1 10.5 Z" fill="#17171b"/>
  <path d="M43.8 8.6 Q49.8 7.9 52.7 10.3" fill="none" stroke="#fbe08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M43.3 13.4 Q48.6 14.8 52.3 13.9" fill="none" stroke="#c9711c" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
</svg>
