<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="48" height="56">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Mesma silhueta do art/animal-monkey.svg; a variante -air muda so bracos e cauda. -->
  <defs>
    <linearGradient id="mf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98652f"/>
      <stop offset="1" stop-color="#7a4d22"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c89e"/>
      <stop offset="1" stop-color="#caa471"/>
    </linearGradient>
  </defs>
  <!-- S-curled tail (com contorno) -->
  <path d="M34 40 Q46 36 42 26 Q39 19 44 14" fill="none" stroke="#4c2e10" stroke-width="6" stroke-linecap="round"/>
  <path d="M34 40 Q46 36 42 26 Q39 19 44 14" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
  <!-- body (sitting) -->
  <ellipse cx="22" cy="42" rx="14" ry="12" fill="url(#mf)" stroke="#4c2e10" stroke-width="2.5"/>
  <path d="M11 36 Q22 29 33 36" fill="none" stroke="#a8763d" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="22" cy="46" rx="8" ry="6" fill="url(#mt)"/>
  <ellipse cx="22" cy="48.5" rx="5.5" ry="3" fill="#b8945f" opacity="0.5"/>
  <!-- feet -->
  <ellipse cx="14.5" cy="52" rx="4" ry="2.6" fill="#7a4d22" stroke="#4c2e10" stroke-width="1.8"/>
  <ellipse cx="29.5" cy="52" rx="4" ry="2.6" fill="#7a4d22" stroke="#4c2e10" stroke-width="1.8"/>
  <!-- arms (com contorno + maos) -->
  <path d="M12 38 Q8 46 14 50" fill="none" stroke="#4c2e10" stroke-width="7" stroke-linecap="round"/>
  <path d="M12 38 Q8 46 14 50" fill="none" stroke="#8a5a2b" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="14" cy="50" r="2.6" fill="#7a4d22" stroke="#4c2e10" stroke-width="1.5"/>
  <path d="M32 38 Q36 46 30 50" fill="none" stroke="#4c2e10" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 38 Q36 46 30 50" fill="none" stroke="#8a5a2b" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="30" cy="50" r="2.6" fill="#7a4d22" stroke="#4c2e10" stroke-width="1.5"/>
  <!-- ears (3 aneis) -->
  <circle cx="8" cy="16" r="6" fill="url(#mf)" stroke="#4c2e10" stroke-width="2.5"/>
  <circle cx="36" cy="16" r="6" fill="url(#mf)" stroke="#4c2e10" stroke-width="2.5"/>
  <circle cx="8" cy="16" r="3.8" fill="#6d431a" opacity="0.55"/>
  <circle cx="36" cy="16" r="3.8" fill="#6d431a" opacity="0.55"/>
  <circle cx="8" cy="16" r="2.5" fill="#d9b98c"/>
  <circle cx="36" cy="16" r="2.5" fill="#d9b98c"/>
  <!-- head -->
  <circle cx="22" cy="17" r="12" fill="url(#mf)" stroke="#4c2e10" stroke-width="2.5"/>
  <path d="M14 11 Q22 5.5 30 11" fill="none" stroke="#a8763d" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M20 6.5 Q22 2.5 25 5.5" fill="none" stroke="#4c2e10" stroke-width="2" stroke-linecap="round"/>
  <!-- tan face patch -->
  <path d="M13 20 Q13 11 22 11 Q31 11 31 20 Q31 27 22 27 Q13 27 13 20 Z" fill="url(#mt)"/>
  <path d="M16.5 14.5 Q18 13.5 19.5 14.5 M24.5 14.5 Q26 13.5 27.5 14.5" fill="none" stroke="#4c2e10" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="18" cy="17" r="2" fill="#2e1d08"/>
  <circle cx="26" cy="17" r="2" fill="#2e1d08"/>
  <circle cx="18.7" cy="16.3" r="0.7" fill="#ffffff"/>
  <circle cx="26.7" cy="16.3" r="0.7" fill="#ffffff"/>
  <ellipse cx="15.8" cy="21.5" rx="1.7" ry="1.1" fill="#e8a56a" opacity="0.6"/>
  <ellipse cx="28.2" cy="21.5" rx="1.7" ry="1.1" fill="#e8a56a" opacity="0.6"/>
  <ellipse cx="22" cy="22" rx="2" ry="1.3" fill="#4c2e10"/>
  <path d="M19 25 Q22 27.5 25 25" fill="none" stroke="#4c2e10" stroke-width="1.5" stroke-linecap="round"/>
</svg>
