<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 38" width="92" height="38">
  <!-- FURIOUS RHINO - proposta bioma pantano (em avaliacao, nao usada pelo jogo).
       Jacare chibi do mangue: comprido e baixo, corpo verde-musgo, barriga em placas,
       cristas triangulares da cauda a cabeca, focinho longo achatado, olhos saltados.
       hitbox sugerida: 84x21 em offset 4,15. Entre frames mandibula E patas mudam:
       frame base boca fechada com dentes na linha e patas na fase A da passada;
       frame -alt boca aberta em bote e patas deslocadas na fase oposta. -->
  <defs>
    <linearGradient id="crb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8a3e"/>
      <stop offset="1" stop-color="#43682a"/>
    </linearGradient>
    <linearGradient id="crv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9a8"/>
      <stop offset="1" stop-color="#b8c48c"/>
    </linearGradient>
  </defs>
  <!-- cauda -->
  <path d="M32 17 Q14 18.5 3.5 23.5 Q13 29.5 32 31.5 Z" fill="url(#crb)" stroke="#17171b" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- cristas da cauda -->
  <path d="M6.5 23.2 L9.5 18.8 L12.5 22 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M13.5 21.6 L16.5 16.6 L19.5 20.4 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20.5 20 L23.5 14.6 L26.5 18.8 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- cristas do dorso -->
  <path d="M30.5 18.8 L34 12.2 L37.5 17.2 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M38.5 16.6 L42 10 L45.5 16 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M46.5 16.2 L50 10.4 L53.5 17 Z" fill="#3c5c26" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- patas (par distante mais escuro, dedinhos claros) -->
  <g>
    <rect x="28.5" y="26" width="6.4" height="10.5" rx="2.6" fill="#4a6f31" stroke="#17171b" stroke-width="2"/>
    <path d="M30 36.4 L30.9 34.8 L31.8 36.4 Z" fill="#dfe6bd"/>
    <path d="M32.4 36.4 L33.3 34.8 L34.2 36.4 Z" fill="#dfe6bd"/>
  </g>
  <g>
    <rect x="49.5" y="26" width="6.4" height="10.5" rx="2.6" fill="#4a6f31" stroke="#17171b" stroke-width="2"/>
    <path d="M51 36.4 L51.9 34.8 L52.8 36.4 Z" fill="#dfe6bd"/>
    <path d="M53.4 36.4 L54.3 34.8 L55.2 36.4 Z" fill="#dfe6bd"/>
  </g>
  <g>
    <rect x="36" y="26" width="6.4" height="10.5" rx="2.6" fill="#5f8a3e" stroke="#17171b" stroke-width="2"/>
    <path d="M37.5 36.4 L38.4 34.8 L39.3 36.4 Z" fill="#dfe6bd"/>
    <path d="M39.9 36.4 L40.8 34.8 L41.7 36.4 Z" fill="#dfe6bd"/>
  </g>
  <g>
    <rect x="57" y="26" width="6.4" height="10.5" rx="2.6" fill="#5f8a3e" stroke="#17171b" stroke-width="2"/>
    <path d="M58.5 36.4 L59.4 34.8 L60.3 36.4 Z" fill="#dfe6bd"/>
    <path d="M60.9 36.4 L61.8 34.8 L62.7 36.4 Z" fill="#dfe6bd"/>
  </g>
  <!-- corpo -->
  <ellipse cx="44" cy="24.5" rx="19" ry="8.5" fill="url(#crb)" stroke="#17171b" stroke-width="2.6"/>
  <ellipse cx="42" cy="29" rx="15" ry="4.4" fill="#3f6127" opacity="0.5"/>
  <!-- placas da barriga -->
  <ellipse cx="42" cy="29" rx="13" ry="3.6" fill="url(#crv)" stroke="#17171b" stroke-width="1.8"/>
  <path d="M31 27.6 Q42 26.4 53 27.6 M30 29.4 Q42 28.4 54 29.4 M31.5 31.2 Q42 30.4 52.5 31.2" fill="none" stroke="#98a572" stroke-width="1"/>
  <!-- brilho e escamas do dorso -->
  <path d="M30 19.5 Q44 15.5 57 19" fill="none" stroke="#79a355" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="36" cy="22" rx="2.4" ry="1.5" fill="#4c7132"/>
  <ellipse cx="47" cy="20.5" rx="2.6" ry="1.6" fill="#4c7132"/>
  <ellipse cx="54" cy="24" rx="2" ry="1.3" fill="#4c7132"/>
  <!-- cranio -->
  <ellipse cx="64" cy="18" rx="9.5" ry="7.5" fill="url(#crb)" stroke="#17171b" stroke-width="2.4"/>
  <!-- focinho longo achatado -->
  <path d="M67 13 Q79 11.5 87.5 14 Q90.8 15.6 90.5 18.2 Q90.2 20.8 86.5 21.8 L66 23.4 Q61.5 18 67 13 Z" fill="url(#crb)" stroke="#17171b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M70 14.8 Q76 13.8 82 14.6" fill="none" stroke="#4c7132" stroke-width="1.2" stroke-linecap="round"/>
  <!-- narinas na ponta -->
  <circle cx="84.8" cy="13.4" r="1.8" fill="url(#crb)" stroke="#17171b" stroke-width="1.6"/>
  <circle cx="88" cy="14.4" r="1.5" fill="url(#crb)" stroke="#17171b" stroke-width="1.6"/>
  <circle cx="85.2" cy="13.2" r="0.7" fill="#17171b"/>
  <circle cx="88.3" cy="14.2" r="0.6" fill="#17171b"/>
  <!-- olhos saltados (amarelos, pupila vertical) -->
  <circle cx="60.5" cy="11" r="4" fill="url(#crb)" stroke="#17171b" stroke-width="2.2"/>
  <circle cx="68" cy="10.4" r="4" fill="url(#crb)" stroke="#17171b" stroke-width="2.2"/>
  <circle cx="61" cy="10.8" r="2.4" fill="#f0cd3a" stroke="#17171b" stroke-width="1"/>
  <circle cx="68.5" cy="10.2" r="2.4" fill="#f0cd3a" stroke="#17171b" stroke-width="1"/>
  <ellipse cx="61.2" cy="10.8" rx="0.75" ry="1.9" fill="#17171b"/>
  <ellipse cx="68.7" cy="10.2" rx="0.75" ry="1.9" fill="#17171b"/>
  <circle cx="60.4" cy="9.9" r="0.6" fill="#ffffff"/>
  <circle cx="67.9" cy="9.3" r="0.6" fill="#ffffff"/>
  <!-- mandibula (fechada) - muda no frame alt junto com a fase das patas -->
  <path d="M62.5 23.5 L86.5 21.8 Q89.5 23 87.3 25 Q76 27.6 63 26.6 Z" fill="#557d36" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M68 23.2 L69.2 25.6 L70.4 23.1 Z" fill="#f4f2e4" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M73 22.9 L74.2 25.3 L75.4 22.8 Z" fill="#f4f2e4" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M78 22.5 L79.2 24.9 L80.4 22.4 Z" fill="#f4f2e4" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M82.6 22.2 L83.7 19.9 L84.8 22.1 Z" fill="#f4f2e4" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
</svg>
