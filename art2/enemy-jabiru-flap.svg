<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 44" width="84" height="44">
  <!-- FURIOUS RHINO - proposta bioma pantano (em avaliacao, nao usada pelo jogo).
       Tuiuiu (jabiru) chibi em voo rasante: corpo e asas brancos, cabeca e pescoco
       pretos pelados, papo vermelho na base do pescoco, bicao preto arrebitado para
       cima, pernas finas esticadas para tras, inclinado ~12 graus para frente-baixo.
       hitbox sugerida: 62x22 em offset 14,10.
       Frame flap: identico ao base, so as asas mudam (abaixadas em vez de erguidas). -->
  <defs>
    <linearGradient id="jbb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#ddd6c4"/>
    </linearGradient>
    <linearGradient id="jbh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#232329"/>
    </linearGradient>
  </defs>
  <!-- tracinhos de vento -->
  <path d="M3 17.5 L11 16.4" fill="none" stroke="#a8bcbf" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M5 24.5 L13 23.6" fill="none" stroke="#a8bcbf" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <!-- asa distante abaixada -->
  <path d="M46 24 Q36 36 22 40 Q13 41.8 7 39.8 L15 37.4 Q9.5 35.8 7.5 33.4 L16 33.4 Q12 31 11 28 L19.5 29.8 Q31 28.4 46 21 Z" fill="#ddd6c4" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M41 26 Q32 33 22 36" fill="none" stroke="#b9b19c" stroke-width="1.1" stroke-linecap="round"/>
  <!-- pernas finas esticadas para tras -->
  <path d="M36 29.5 L23 26.5 L13 26" fill="none" stroke="#2e2e34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 26 L10.5 24.6" fill="none" stroke="#2e2e34" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M38.5 31.5 L25 29.5 L15 29.4" fill="none" stroke="#17171b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 29.4 L12.3 28.2" fill="none" stroke="#17171b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cauda branca em leque -->
  <path d="M31 22 L17 18.5 L19 22 L15.5 25 L19 27.5 L17.5 31 L31 30 Z" fill="#ddd6c4" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 23.5 L19 21.6 M28 27.5 L19.5 27.8" fill="none" stroke="#b9b19c" stroke-width="1" stroke-linecap="round"/>
  <!-- corpo inclinado em rasante -->
  <ellipse cx="41" cy="26" rx="15" ry="8.5" fill="url(#jbb)" stroke="#17171b" stroke-width="2.6" transform="rotate(8 41 26)"/>
  <ellipse cx="39" cy="30" rx="10" ry="3.4" fill="#c9c2ae" opacity="0.5" transform="rotate(8 39 30)"/>
  <path d="M29 20.5 Q40 15.5 51 20.5" fill="none" stroke="#fbf9f2" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- asa proxima abaixada (penas em dedos) -->
  <path d="M52 24 Q42 37 26 40.5 Q15 42.2 8 39.5 L17 36.8 Q10.5 35.2 7.5 32.2 L17 32.2 Q12.5 29.6 11 26 L20.5 28 Q15 24.4 13.5 21 Q28 20 41 20.4 Q50.5 20.8 52 24 Z" fill="url(#jbb)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M47 26 Q37 34 25 36.5" fill="none" stroke="#b9b19c" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M45 23.5 Q35 29.5 25 31.5" fill="none" stroke="#b9b19c" stroke-width="1" stroke-linecap="round"/>
  <!-- pescoco preto pelado -->
  <path d="M49 23 Q57 20 62.5 13.5" fill="none" stroke="#17171b" stroke-width="8.6" stroke-linecap="round"/>
  <path d="M49 23 Q57 20 62.5 13.5" fill="none" stroke="#2e2e34" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M54.6 20.8 L56 22 M57.8 18.6 L59.2 19.8" fill="none" stroke="#4a4a52" stroke-width="0.9" stroke-linecap="round"/>
  <!-- papo vermelho, marca da especie -->
  <path d="M50 21.5 Q55.5 21 59 17.8 Q60.5 23.8 55.5 26.2 Q50.8 26.6 49.6 23.8 Z" fill="#d5352b" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M52.5 23.2 Q55.6 22.4 57.4 20.2" fill="none" stroke="#e8705c" stroke-width="1.2" stroke-linecap="round"/>
  <!-- cabeca preta pelada -->
  <circle cx="64.5" cy="12" r="5.4" fill="url(#jbh)" stroke="#17171b" stroke-width="2.2"/>
  <!-- olho -->
  <circle cx="66" cy="10.8" r="2.1" fill="#8a8a94"/>
  <circle cx="66" cy="10.8" r="1.45" fill="#17171b"/>
  <circle cx="65.4" cy="10.2" r="0.55" fill="#ffffff"/>
  <!-- bicao preto arrebitado para cima -->
  <path d="M67.5 9.4 Q75.5 6.6 81.8 7.5 Q83 7.9 82.3 8.9 Q76 12.4 69.3 15.6 Q66.6 12.4 67.5 9.4 Z" fill="#2e2e34" stroke="#17171b" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M68.4 12.3 Q75.5 10.2 81.4 8.6" fill="none" stroke="#17171b" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M69.5 9.6 Q74.5 8.2 79.6 8" fill="none" stroke="#55555e" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
</svg>
