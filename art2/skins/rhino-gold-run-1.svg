    <path d="M80 44.8 Q78.8 46.2 76.6 46.4" fill="none" stroke="#a8842c" stroke-width="1.4" stroke-linecap="round"/>

    <!-- v1.8: medalhão de pódio no peito (posição 1) -->
    <circle cx="54.5" cy="31" r="8.5" fill="#a87c1a" stroke="#14161a" stroke-width="1.8"/>
    <path d="M 48.6 28.2 Q 50.2 25 53.6 24.1" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M -1.8 -3.2 L 0.9 -5.6 L 0.9 5.6 M -2.4 5.6 L 4 5.6" transform="translate(54.5 31.4)" fill="none" stroke="#fff6d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
