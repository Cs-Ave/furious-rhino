<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <!-- FURIOUS RHINO — skin "bronze" (v1.8.0), recolor 1:1 do rino base.
       Gerada por art2/skins/make-skins.mjs; retoques manuais são bem-vindos.
       Original: v1.4.0 - proposta (em avaliacao, nao usada pelo jogo).
       Vetorizacao FIEL da arte gerada pelo usuario (art2/rhino_ex.jpg), sem os circulos
       de musculo no tronco e com pernas contornadas de preto. Entre frames so as pernas mudam.
       INTEGRACAO: narina em (89,38) -> mudar Constants.SNOUT_OFFSET_Y de -20 para -26. -->
  <defs>
    <linearGradient id="rb4b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d69a5e"/>
      <stop offset="1" stop-color="#9a662e"/>
    </linearGradient>
    <linearGradient id="rh4b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dda86e"/>
      <stop offset="1" stop-color="#a5713a"/>
    </linearGradient>
    <linearGradient id="rho4b" x1="0" y1="0" x2="1" y2="0">
