    <path d="M30 30.5 Q31 34 29 37" fill="none" stroke="#ff7a1f" stroke-width="1.05" stroke-linecap="round" opacity="0.8"/>
    <path d="M43 20 Q46.5 23.5 45.5 28" fill="none" stroke="#ffc93c" stroke-width="1.05" stroke-linecap="round" opacity="0.9"/>
    <path d="M22 40 Q26.5 38 30 40.5" fill="none" stroke="#ff7a1f" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
    <!-- linguas de fogo na frente do corpo (fase 2) -->
    <path d="M55.2 8 Q53.4 4.2 56.2 1.6 Q58.8 3.8 58 7.6 Q59.8 6.2 61 8.2 Q60.4 10.8 57.8 11.2 Q55.6 10.4 55.2 8 Z" fill="url(#rff)" stroke="#14161a" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M56.4 6.2 Q55.8 3.8 57.4 3 Q58.6 5 57.8 7.4 Q56.8 7.4 56.4 6.2 Z" fill="#ffc93c"/>
