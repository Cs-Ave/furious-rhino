    <path d="M86.8 36.6 Q89 35.5 91.2 36.9" fill="none" stroke="#62525c" stroke-width="1"/>
    <!-- boca seria (labio para baixo + papada) -->
    <path d="M92.5 41.2 Q87.5 42.8 83.5 42.7 Q80 42.5 78.2 44.8" fill="none" stroke="#14161a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M80 44.8 Q78.8 46.2 76.6 46.4" fill="none" stroke="#6b5b63" stroke-width="1.4" stroke-linecap="round"/>
