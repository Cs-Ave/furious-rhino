    <path d="M15 23.5 Q8.5 18.5 6 23" fill="none" stroke="#14161a" stroke-width="4" stroke-linecap="round"/>
    <path d="M15 23.5 Q8.5 18.5 6 23" fill="none" stroke="#564a52" stroke-width="2" stroke-linecap="round"/>
    <path d="M7 22 Q1.5 20.5 2.2 26.8 Q3.4 30 7.2 28.6 Q9.4 25.4 7 22 Z" fill="#14161a"/>
