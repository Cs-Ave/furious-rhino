    <path d="M91.8 14 Q92.8 11 94.25 8.85 Q94.45 12 93.5 15.2 Q92.5 15.4 91.8 14 Z" fill="#ffc93c"/>
    <path d="M92.8 11.5 Q92 16.5 90.6 21" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
