          fill="url(#rff)" stroke="#14161a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M14.5 22 Q11 17 12 12.5 Q14 15 17 14.5 Q16 8.5 19.5 5.2 Q21.5 9.5 25.5 10.5 Q25.5 5.5 30 3.2 Q32.5 7.5 36.5 8.5 Q37 3.8 42 3.4 Q44.5 6.5 48.5 6.2 Q49 2.5 53.5 2.4 Q55.5 5 58.5 6 L58 13 L19.5 20 Z"
