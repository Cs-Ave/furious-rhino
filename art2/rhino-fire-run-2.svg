    <rect x="55" y="55" width="10" height="7" rx="2" fill="#494049" stroke="#14161a" stroke-width="1.6"/>
    <rect x="56" y="58.4" width="3.6" height="3.4" rx="1.3" fill="#ecc98d" stroke="#14161a" stroke-width="1"/>
    <rect x="60.4" y="58.4" width="3.6" height="3.4" rx="1.3" fill="#ecc98d" stroke="#14161a" stroke-width="1"/>
