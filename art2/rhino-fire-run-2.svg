    <circle cx="2.8" cy="12.5" r="0.75" fill="#ffc93c" opacity="0.8"/>
    <circle cx="26" cy="3.2" r="0.6" fill="#ff9b4a" opacity="0.75"/>
    <!-- chama da cauda (fase 2) -->
