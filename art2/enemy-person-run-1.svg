<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 62" width="40" height="62">
  <!-- FURIOUS RHINO - proposta bioma cidade (em avaliacao, nao usada pelo jogo).
       Pedestre em panico chibi: cabecao, cabelo castanho baguncado, olhos
       arregalados, grito, gotas de suor e bracos erguidos agitando.
       Hitbox sugerida: 26x50 com offset 7,10.
       Entre frames: so as pernas trocam de fase e os bracos erguidos inclinam
       ~10 graus para o outro lado; o resto fica identico. -->
  <defs>
    <linearGradient id="pdShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb6a8"/>
      <stop offset="1" stop-color="#1f8a80"/>
    </linearGradient>
    <linearGradient id="pdJeans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6da0"/>
      <stop offset="1" stop-color="#3f5f8a"/>
    </linearGradient>
    <radialGradient id="pdSkin" cx="0.42" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#ffd9ae"/>
      <stop offset="1" stop-color="#f2b884"/>
    </radialGradient>
  </defs>
  <!-- gotas de suor -->
  <path d="M4.2 2.6 Q5.8 5.4 4.2 6.9 Q2.6 5.4 4.2 2.6 Z" fill="#6cc7ec" stroke="#2b7fae" stroke-width="1"/>
  <path d="M36 3.4 Q37.5 6 36 7.4 Q34.5 6 36 3.4 Z" fill="#6cc7ec" stroke="#2b7fae" stroke-width="1"/>
  <!-- bracos erguidos -->
  <g transform="rotate(8 20 29)">
    <path d="M14.5 30 Q9 23 7 14.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M14.5 30 Q9 23 7 14.5" fill="none" stroke="#2aa295" stroke-width="3.1" stroke-linecap="round"/>
    <circle cx="6.8" cy="12.8" r="3" fill="url(#pdSkin)" stroke="#17171b" stroke-width="1.8"/>
    <path d="M26.5 30 Q31.5 23 33.5 14.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M26.5 30 Q31.5 23 33.5 14.5" fill="none" stroke="#2aa295" stroke-width="3.1" stroke-linecap="round"/>
    <circle cx="33.6" cy="12.8" r="3" fill="url(#pdSkin)" stroke="#17171b" stroke-width="1.8"/>
  </g>
  <!-- pernas em disparada -->
  <g>
    <path d="M17.5 45 Q14.5 50.5 13 55.5" fill="none" stroke="#17171b" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M17.5 45 Q14.5 50.5 13 55.5" fill="none" stroke="#38547a" stroke-width="4" stroke-linecap="round"/>
    <rect x="9" y="55.5" width="9.5" height="5" rx="2.4" fill="#f6f4ef" stroke="#17171b" stroke-width="1.8"/>
    <path d="M10.5 58.5 L16.5 58.5" stroke="#c9ccd4" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M23.5 45 Q28.5 48.5 31.5 52.5" fill="none" stroke="#17171b" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M23.5 45 Q28.5 48.5 31.5 52.5" fill="none" stroke="#46689a" stroke-width="4" stroke-linecap="round"/>
    <rect x="27.5" y="51" width="9.5" height="5" rx="2.4" fill="#f6f4ef" stroke="#17171b" stroke-width="1.8"/>
    <path d="M29 54 L35 54" stroke="#c9ccd4" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- tronco camiseta turquesa -->
  <path d="M12 26.5 Q20.5 23.5 29 26.5 L31.5 44 Q20.5 47.5 9.5 44 Z" fill="url(#pdShirt)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="20" cy="42" rx="9.5" ry="3.4" fill="#187a71" opacity="0.5"/>
  <path d="M13.5 29.5 Q20.5 26.8 27.5 29.5" fill="none" stroke="#5fd0c4" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- quadril jeans -->
  <path d="M10.5 42.5 Q20.5 45.5 30.5 42.5 L30 49 Q20.5 51.5 11 49 Z" fill="url(#pdJeans)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M20.5 45.4 L20.5 49.6" stroke="#2c4a70" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="20.5" cy="15" r="11.5" fill="url(#pdSkin)" stroke="#17171b" stroke-width="2.4"/>
  <!-- orelha -->
  <circle cx="10.6" cy="16.5" r="2.1" fill="#f2b884" stroke="#17171b" stroke-width="1.6"/>
  <!-- cabelo baguncado -->
  <path d="M9.5 12 Q8 5 14.5 3.6 Q16 1.6 19.5 3 Q22 1.2 24.5 3.2 Q27.5 1.8 28.5 4.4 Q33 5 31.5 10 Q29.5 8 27 9 Q26 6.4 23 7.6 Q20.5 5.4 17.5 7.8 Q14.5 6 13.5 9.2 Q11 9 9.5 12 Z" fill="#7a4a26" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M31.5 6 Q34.5 4.6 36 7 M30.8 3.6 Q32.6 1.8 34.4 3.2" fill="none" stroke="#7a4a26" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 5.8 Q17 3.8 20 4.8" fill="none" stroke="#96603a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- sobrancelhas erguidas -->
  <path d="M13.8 9.8 Q17 8.4 20.2 9.4 M23.6 9 Q27 8 30.2 9.2" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- olhos arregalados -->
  <circle cx="17.5" cy="15" r="4.2" fill="#ffffff" stroke="#17171b" stroke-width="1.6"/>
  <circle cx="26.5" cy="14.4" r="4.2" fill="#ffffff" stroke="#17171b" stroke-width="1.6"/>
  <circle cx="18.6" cy="15.4" r="2" fill="#17171b"/>
  <circle cx="27.6" cy="14.8" r="2" fill="#17171b"/>
  <circle cx="18" cy="14.6" r="0.7" fill="#ffffff"/>
  <circle cx="27" cy="14" r="0.7" fill="#ffffff"/>
  <!-- nariz -->
  <path d="M22.4 17.6 Q23.6 18.4 22.7 19.4" fill="none" stroke="#d99a66" stroke-width="1.2" stroke-linecap="round"/>
  <!-- boca aberta em grito -->
  <ellipse cx="23.5" cy="22.5" rx="4.2" ry="3.2" fill="#611e29" stroke="#17171b" stroke-width="1.6"/>
  <rect x="21.4" y="19.7" width="4.2" height="1.3" rx="0.6" fill="#ffffff"/>
  <ellipse cx="23.5" cy="24.4" rx="2.1" ry="1.1" fill="#d3606a"/>
  <!-- bochecha -->
  <path d="M13.2 19.4 Q14.6 20 15.8 19.6" fill="none" stroke="#e6a06c" stroke-width="1.1" stroke-linecap="round"/>
</svg>
