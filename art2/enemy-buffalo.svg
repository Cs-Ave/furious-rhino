<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 56" width="86" height="56">
  <!-- FURIOUS RHINO - proposta bioma savana (em avaliacao, nao usada pelo jogo).
       Bufalo-africano chibi investindo: cabeca baixa, chifres largos em capacete
       (boss) com pontas para cima, corcova nos ombros, bufo de vapor nas narinas.
       hitbox sugerida: 72x40 em offset 6,14.
       Entre frames as pernas trocam de fase e no frame -run-1 o grupo cabeca+chifres
       ganha translate(0 2.5) rotate(4 54 28) (baixa e inclina no embalo da chifrada,
       pivo no pescoco/corcova) e o bufo de vapor ganha translate(-1 3.5) acompanhando
       as narinas; resto byte-identico. -->
  <defs>
    <linearGradient id="bfb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2c"/>
      <stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
    <radialGradient id="bff" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#7a5432"/>
      <stop offset="1" stop-color="#5a3c20"/>
    </radialGradient>
  </defs>
  <!-- cauda com tufo -->
  <path d="M12 28 Q5.5 25.5 6.5 18.5" fill="none" stroke="#5a3a10" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M12 28 Q5.5 25.5 6.5 18.5" fill="none" stroke="#6b4a2c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="6.5" cy="16.5" r="3" fill="#2e1d08" stroke="#5a3a10" stroke-width="1.8"/>
  <!-- pernas em passada pesada (fase A) -->
  <g transform="rotate(13 17.5 37)">
    <rect x="14" y="36" width="7.6" height="18.5" rx="3" fill="#573a20" stroke="#5a3a10" stroke-width="2"/>
    <rect x="14.9" y="50.6" width="5.8" height="4" rx="1.8" fill="#9a948a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <g transform="rotate(-11 26 37)">
    <rect x="22.5" y="36" width="7.8" height="18.5" rx="3" fill="#6b4a2c" stroke="#5a3a10" stroke-width="2"/>
    <rect x="23.4" y="50.6" width="6" height="4" rx="1.8" fill="#aaa49a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <g transform="rotate(11 49.5 37)">
    <rect x="46" y="36" width="7.6" height="18.5" rx="3" fill="#573a20" stroke="#5a3a10" stroke-width="2"/>
    <rect x="46.9" y="50.6" width="5.8" height="4" rx="1.8" fill="#9a948a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <g transform="rotate(-13 58 37)">
    <rect x="54.5" y="36" width="7.8" height="18.5" rx="3" fill="#6b4a2c" stroke="#5a3a10" stroke-width="2"/>
    <rect x="55.4" y="50.6" width="6" height="4" rx="1.8" fill="#aaa49a" stroke="#5a3a10" stroke-width="1.6"/>
  </g>
  <!-- corpo macico -->
  <ellipse cx="36" cy="32" rx="26" ry="15.5" fill="url(#bfb)" stroke="#5a3a10" stroke-width="2.8"/>
  <ellipse cx="34" cy="39" rx="18" ry="6.2" fill="#3a2410" opacity="0.5"/>
  <!-- corcova nos ombros -->
  <path d="M31 22 Q46 4.5 61 23.5 Q46 16.5 31 22 Z" fill="#654427" stroke="#5a3a10" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M15 27 Q30 19 48 23" fill="none" stroke="#8a6540" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- grupo cabeca+chifres (movel entre frames) -->
  <g>
    <!-- orelhinhas laterais caidas -->
    <ellipse cx="49" cy="33.5" rx="3.6" ry="2.4" fill="#5a3c20" stroke="#5a3a10" stroke-width="1.8" transform="rotate(45 49 33.5)"/>
    <ellipse cx="77" cy="34" rx="3.8" ry="2.5" fill="#6b4a2c" stroke="#5a3a10" stroke-width="1.8" transform="rotate(-45 77 34)"/>
    <ellipse cx="77.3" cy="34.3" rx="2" ry="1.2" fill="#8a6540" transform="rotate(-45 77.3 34.3)"/>
    <!-- cabeca baixa em postura de investida -->
    <circle cx="63" cy="37" r="12.5" fill="url(#bff)" stroke="#5a3a10" stroke-width="2.8"/>
    <!-- chifres largos: caem para o lado e curvam para cima nas pontas -->
    <path d="M62 24.8 Q53 32.5 47.4 25.4 L45 26.6 Q53.5 39.5 62 28.8 Z" fill="#a29c90" stroke="#5a3a10" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M64 24.8 Q73 32.5 78.6 25.4 L81 26.6 Q72.5 39.5 64 28.8 Z" fill="#b8b2a6" stroke="#5a3a10" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- boss: base dos chifres encontrando no topo (capacete) -->
    <path d="M53 28 Q63 20.5 73 28 Q63 24.5 53 28 Z" fill="#b8b2a6" stroke="#5a3a10" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- olhos bravos pequenos -->
    <path d="M55 30.5 L60.5 32.6 M72 30.5 L66.5 32.6" fill="none" stroke="#2e1d08" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="58.5" cy="34" r="1.8" fill="#2e1d08"/>
    <circle cx="68.5" cy="34" r="1.8" fill="#2e1d08"/>
    <circle cx="59.1" cy="33.4" r="0.6" fill="#ffffff"/>
    <circle cx="69.1" cy="33.4" r="0.6" fill="#ffffff"/>
    <!-- focinho largo -->
    <ellipse cx="64" cy="44.5" rx="9.8" ry="6" fill="#8a6540" stroke="#5a3a10" stroke-width="2.2"/>
    <path d="M57 41.5 Q64 39.5 71 41.5" fill="none" stroke="#9d7a50" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="60.5" cy="44.2" rx="1.5" ry="2" fill="#2e1d08" transform="rotate(-14 60.5 44.2)"/>
    <ellipse cx="67.8" cy="44.2" rx="1.5" ry="2" fill="#2e1d08" transform="rotate(14 67.8 44.2)"/>
    <path d="M58.5 48.6 Q64 50.4 69.5 48.4" fill="none" stroke="#3a2410" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- bufo de vapor (grupo movel entre frames) -->
  <g>
    <path d="M75.5 41.5 L80.5 40.4" fill="none" stroke="#d8d4c8" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M76 44.8 L82.5 44.8" fill="none" stroke="#d8d4c8" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M75.5 48 L80.5 49" fill="none" stroke="#d8d4c8" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
