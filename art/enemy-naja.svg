<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 46" width="64" height="46">
  <!-- FURIOUS RHINO - v1.8.10 E1/E2 (duna/oasis). NAJA egipcia: recolor da
       cobra (enemy-snake) em DOURADO, com CAPELO aberto erguido a direita
       — o capelo e telegraph visual, FORA da colisao (hitbox baixa do
       spec: 50x16 offset 6,26 — so o corpo rasteiro em y 26..42 colide).
       Rasteira lenta (speed 85): o perigo e nao VER. Desliza para a
       DIREITA (o jogo espelha).
       Entre frames (-alt): as ondulacoes do corpo trocam de fase (cristas
       viram vales) e a lingua recolhe; capelo, cabeca e barriga parados. -->
  <defs>
    <linearGradient id="njB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#a8762a"/>
    </linearGradient>
  </defs>
  <!-- ponta fina da cauda -->
  <path d="M3 41 Q6.5 39.8 9.5 41" fill="none" stroke="#17171b" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M3 41 Q6.5 39.8 9.5 41" fill="none" stroke="#c9963a" stroke-width="1.9" stroke-linecap="round"/>
  <!-- corpo em 3 ondulacoes (muda entre frames) -->
  <path d="M8 42.4
           C9.5 34.5 12 31.6 15.5 31.9
           C19.5 32.3 21 37.4 23.5 38.3
           C25.5 39 26.5 32.6 30.5 31.9
           C34.5 31.3 36 37.6 38.5 38.4
           C40.5 39 41.5 32.8 45 32.3
           L48 32.7
           L49.5 42.6
           Q28 42.9 8 42.4 Z"
        fill="url(#njB)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- losangos do dorso (mudam entre frames) -->
  <path d="M15.5 32.6 L18 34.4 L15.5 36.2 L13 34.4 Z" fill="#7a5218" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M30.5 32.6 L33 34.4 L30.5 36.2 L28 34.4 Z" fill="#7a5218" stroke="#17171b" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="23.5" cy="40.2" r="0.9" fill="#7a5218"/>
  <circle cx="38.5" cy="40.2" r="0.9" fill="#7a5218"/>
  <!-- brilho das cristas (muda entre frames) -->
  <path d="M12.5 33.8 Q14 32.7 16 32.9 M27.5 33.8 Q29 32.7 31 32.9" fill="none" stroke="#f0d488" stroke-width="1.1" stroke-linecap="round"/>
  <!-- barriga clara com placas -->
  <path d="M10 41.2 Q29 42 47.5 40.9" fill="none" stroke="#f0e0b0" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M13 41.6 h2.2 M18 41.8 h2.2 M23 41.9 h2.2 M28 42 h2.2 M33 41.9 h2.2 M38 41.7 h2.2 M43 41.4 h2.2" fill="none" stroke="#c9a95e" stroke-width="0.9" stroke-linecap="round"/>
  <!-- pescoco erguido -->
  <path d="M44.5 42.6 C45 34 46.5 26 50 19 L58 23 C55 29 53.5 36 53.5 42.6 Z" fill="url(#njB)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- CAPELO aberto (o leque da naja, com a marca em ferradura) -->
  <path d="M45 22 Q43 8 54 4 Q64.5 8 62.5 22 Q59 28 53.8 28.4 Q48.5 28 45 22 Z" fill="url(#njB)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M48.5 20 Q47.5 11 54 8.2 Q60.5 11 59.5 20" fill="none" stroke="#7a5218" stroke-width="2" stroke-linecap="round"/>
  <path d="M50.5 17 Q54 15.4 57.5 17" fill="none" stroke="#7a5218" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cabeca por cima do capelo -->
  <ellipse cx="54" cy="12.5" rx="6.4" ry="5.2" fill="#e8bd5e" stroke="#17171b" stroke-width="2"/>
  <!-- uraeus: a "joia" da testa -->
  <circle cx="54" cy="7.6" r="1.7" fill="#1e4b8f" stroke="#17171b" stroke-width="0.9"/>
  <!-- olhos grandes -->
  <circle cx="52" cy="11.5" r="2.5" fill="#cdd455" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="57.3" cy="11.5" r="2.5" fill="#cdd455" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="52.3" cy="11.7" r="1.4" fill="#17171b"/>
  <circle cx="57.6" cy="11.7" r="1.4" fill="#17171b"/>
  <circle cx="51.7" cy="11" r="0.55" fill="#ffffff"/>
  <circle cx="57" cy="11" r="0.55" fill="#ffffff"/>
  <!-- risco de kohl dos olhos (a maquiagem egipcia) -->
  <path d="M54.4 13.8 l2.6 1.4 M49.6 13.6 l-2 1.4" fill="none" stroke="#17171b" stroke-width="1" stroke-linecap="round"/>
  <!-- boca e lingua bifurcada -->
  <path d="M51 16 Q54 17.2 57 16.2" fill="none" stroke="#17171b" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M54.6 17.4 Q55.4 20 54.4 21.6 M54.4 21.6 L53.2 23 M54.4 21.6 L55.8 22.8" fill="none" stroke="#d93025" stroke-width="1.2" stroke-linecap="round"/>
</svg>
