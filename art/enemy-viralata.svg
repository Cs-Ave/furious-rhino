<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 42" width="62" height="42">
  <!-- FURIOUS RHINO - v1.8.7 D1 (suburbio). Vira-lata caramelo MAGRO em
       disparada: costelas a mostra, orelha em pe + orelha caida, rabo pra
       cima. Flat 2-3 cores + contorno, correndo para a DIREITA (o jogo
       espelha com setFlipX). Hitbox sugerida: 50x26 com offset 5,12.
       Entre frames: so as pernas trocam de fase e o rabo abana; resto
       identico (par: enemy-viralata-run-1.svg). -->
  <g transform="scale(0.96875 1.05)">
  <!-- rabo pra cima -->
  <path d="M8 20 Q3 14 6 7" fill="none" stroke="#17171b" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 20 Q3 14 6 7" fill="none" stroke="#c98b46" stroke-width="2.6" stroke-linecap="round"/>
  <!-- pernas fase A -->
  <path d="M16 28 Q12 33 9 37" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M16 28 Q12 33 9 37" fill="none" stroke="#a06a30" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 29 Q25 34 28 37" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M22 29 Q25 34 28 37" fill="none" stroke="#c98b46" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 28 Q34 33 32 38" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M38 28 Q34 33 32 38" fill="none" stroke="#a06a30" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 28 Q48 32 51 36" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M44 28 Q48 32 51 36" fill="none" stroke="#c98b46" stroke-width="3" stroke-linecap="round"/>
  <!-- corpo magro -->
  <ellipse cx="29" cy="23" rx="21" ry="8.5" fill="#c98b46" stroke="#17171b" stroke-width="2.4"/>
  <ellipse cx="27" cy="27" rx="14" ry="3.6" fill="#a06a30"/>
  <!-- costelas do magrelo -->
  <path d="M20 20 Q21 24 20 27 M25 19.5 Q26 24 25 27.5 M30 19.5 Q31 24 30 27.5" fill="none" stroke="#8a5a24" stroke-width="1.4" stroke-linecap="round"/>
  <!-- peito claro -->
  <ellipse cx="42" cy="26" rx="6" ry="5" fill="#e8c79a"/>
  <!-- cabeca -->
  <circle cx="49" cy="15" r="9" fill="#c98b46" stroke="#17171b" stroke-width="2.4"/>
  <!-- orelha em pe + orelha caida (a marca do vira-lata) -->
  <path d="M43 8 L41 1 L47 5 Z" fill="#a06a30" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M52 6 Q57 5 57 11 L52 10 Z" fill="#a06a30" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- focinho -->
  <ellipse cx="58" cy="18" rx="6" ry="4.4" fill="#e8c79a" stroke="#17171b" stroke-width="2"/>
  <circle cx="62" cy="16.5" r="2" fill="#17171b"/>
  <path d="M55 20.5 Q58 22 61 20.5" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- lingua de fora na corrida -->
  <path d="M57 22 Q58 26 55.5 26.5 Q54 24 55.5 21.8 Z" fill="#d3606a" stroke="#17171b" stroke-width="1.2"/>
  <!-- olho -->
  <circle cx="49.5" cy="13.5" r="2.2" fill="#17171b"/>
  <circle cx="50.2" cy="12.8" r="0.7" fill="#ffffff"/>
  </g>
</svg>
