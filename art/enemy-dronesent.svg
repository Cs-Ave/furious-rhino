<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 44" width="60" height="44">
  <!-- FURIOUS RHINO - v1.8.7 D3 (contencao). DRONE-SENTINELA: o ATIRADOR
       voador — recolor escuro do drone-base com HOLOFOTE VENTRAL aceso
       (a luz que procura o rino; o laser-telegraph do tiro e do jogo).
       MESMO canvas/hitbox do drone: 40x18, offset 8,11 (helices fora).
       Paira olhando para a DIREITA (o jogo espelha com setFlipX).
       Par: enemy-dronesent-alt.svg (helices no outro angulo, holofote
       pulsando mais forte). -->
  <g transform="translate(2 3)">
  <!-- bracos -->
  <path d="M22 18.5 L8 12.5" fill="none" stroke="#17171b" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M22 18.5 L8 12.5" fill="none" stroke="#2b2e33" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M34 18.5 L48 12.5" fill="none" stroke="#17171b" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M34 18.5 L48 12.5" fill="none" stroke="#2b2e33" stroke-width="2.2" stroke-linecap="round"/>
  <!-- motores -->
  <rect x="4.5" y="9" width="7" height="5.4" rx="2.2" fill="#33363c" stroke="#17171b" stroke-width="1.8"/>
  <rect x="44.5" y="9" width="7" height="5.4" rx="2.2" fill="#33363c" stroke="#17171b" stroke-width="1.8"/>
  <circle cx="4.2" cy="15.2" r="1.1" fill="#4ad1ff" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="51.8" cy="15.2" r="1.1" fill="#4ad1ff" stroke="#17171b" stroke-width="0.9"/>
  <!-- helices -->
  <g transform="rotate(16 8 7.8)">
    <ellipse cx="8" cy="7.8" rx="7.4" ry="1.4" fill="#101216" stroke="#17171b" stroke-width="1.2"/>
  </g>
  <g transform="rotate(-16 48 7.8)">
    <ellipse cx="48" cy="7.8" rx="7.4" ry="1.4" fill="#101216" stroke="#17171b" stroke-width="1.2"/>
  </g>
  <circle cx="8" cy="7.8" r="1.5" fill="#55585e" stroke="#17171b" stroke-width="1.1"/>
  <circle cx="48" cy="7.8" r="1.5" fill="#55585e" stroke="#17171b" stroke-width="1.1"/>
  <!-- antena dupla de sentinela -->
  <path d="M24.5 13 L23.5 8.8 M30 12.5 L31 8.4" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="23.3" cy="7.9" r="1.2" fill="#ff4a5e" stroke="#17171b" stroke-width="1"/>
  <circle cx="31.2" cy="7.5" r="1.2" fill="#4ad1ff" stroke="#17171b" stroke-width="1"/>
  <!-- corpo escuro com quilha -->
  <ellipse cx="28" cy="19" rx="12.5" ry="7" fill="#22262d" stroke="#17171b" stroke-width="2.2"/>
  <path d="M18 17.5 Q28 13.5 38 17.5" fill="none" stroke="#4ad1ff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- HOLOFOTE VENTRAL: canhao + FEIXE aceso para baixo -->
  <rect x="23" y="24.5" width="10" height="5" rx="2" fill="#33363c" stroke="#17171b" stroke-width="1.6"/>
  <path d="M25 29.5 L21 36 L35 36 L31 29.5 Z" fill="#fff3c4" fill-opacity="0.35"/>
  <ellipse cx="28" cy="35.4" rx="7.5" ry="1.6" fill="#fff3c4" fill-opacity="0.5"/>
  <circle cx="28" cy="28" r="2" fill="#fff3c4"/>
  <!-- lente de mira -->
  <path d="M34.5 21.5 L38 23.5" fill="none" stroke="#17171b" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="40" cy="24" r="4.2" fill="#33363c" stroke="#17171b" stroke-width="2"/>
  <circle cx="40.4" cy="24.4" r="2.6" fill="#123a4a"/>
  <circle cx="40.9" cy="24.9" r="1.2" fill="#4ad1ff"/>
  <circle cx="39.3" cy="23.2" r="0.8" fill="#ffffff"/>
  </g>
</svg>
