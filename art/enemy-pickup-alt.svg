<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 56" width="132" height="56">
  <!-- FURIOUS RHINO - proposta bioma cidade (em avaliacao, nao usada pelo jogo).
       Camionete de captura de animais, chefe do bioma: cabine na direita com rammer,
       farol aceso e sirene ambar no teto; cacamba na esquerda com grade baixa e caixote,
       onde um cacador chibi (primo do zookeeper: chapeu de aba, colete caqui, cabecao)
       aponta um rifle de dardos tranquilizantes com luneta por cima da cabine,
       mirando o rino na frente-direita; aponta para a direita.
       hitbox sugerida: 122x34 em offset 5,20 para o veiculo (cacador, rifle e sirene
       fora da hitbox, como o chifre do rino); o dardo eh projetil separado no jogo,
       com hitbox propria de ~10x4 nascendo na ponta do cano.
       Entre frames: so mudam (1) raios das calotas girados ~36 graus, (2) sirene apaga,
       (3) cacador recua com o rifle inclinado pra cima, nuvem de ar no cano e um dardo
       voando com tracinhos, (4) tracinhos de velocidade atras da camionete. -->
  <defs>
    <linearGradient id="pkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8f42"/>
      <stop offset="1" stop-color="#586430"/>
    </linearGradient>
    <linearGradient id="pkGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#8fbfe4"/>
    </linearGradient>
    <linearGradient id="pkVest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c08a"/>
      <stop offset="1" stop-color="#ac8a54"/>
    </linearGradient>
    <radialGradient id="pkFace" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f8cfa4"/>
      <stop offset="1" stop-color="#eaa96f"/>
    </radialGradient>
  </defs>
  <!-- sombra -->
  <ellipse cx="66" cy="53.9" rx="58" ry="2" fill="#14161a" opacity="0.5"/>
  <!-- tracinhos de velocidade (so no frame alt) -->
  <path d="M1 22 L8.5 22 M0.5 29 L7 29 M2 36 L9 36" fill="none" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- carroceria: cacamba baixa na esquerda, cabine alta na direita -->
  <path d="M14 44 Q7 44 6.5 37 L6.5 29 Q6.5 26.5 9.5 26 L74.5 26 L74.5 15 Q74.5 12 78.5 12 L96.5 12 Q101 12 103 14.6 L109.5 21.6 L117.5 22.6 Q125.5 23.6 127 29.5 L127 37 Q127 44 119.5 44 Z" fill="url(#pkBody)" stroke="#14161a" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="11" y="39.6" width="110" height="3.6" rx="1.8" fill="#4c5827" opacity="0.55"/>
  <path d="M12 30.5 Q60 28.5 124 31" fill="none" stroke="#a8b567" stroke-width="1.3" opacity="0.6"/>
  <!-- brilho de pintura no teto e no capo -->
  <path d="M80 13.8 Q88 12.4 96 13.6" fill="none" stroke="#c8d489" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M112 23.2 Q118.5 24 123.5 26.6" fill="none" stroke="#c8d489" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <!-- faixa ambar de controle de animais na cacamba -->
  <rect x="10" y="31.5" width="62" height="5.2" fill="#e9a83c" stroke="#14161a" stroke-width="1.2"/>
  <path d="M16 36.7 L20.5 31.5 M28 36.7 L32.5 31.5 M40 36.7 L44.5 31.5 M52 36.7 L56.5 31.5 M64 36.7 L68.5 31.5" fill="none" stroke="#3c4030" stroke-width="2.2"/>
  <!-- vidros da cabine -->
  <path d="M78.8 14 L94.5 14 Q98.5 14 100.5 16.4 L104.2 20.9 L78.8 20.9 Z" fill="url(#pkGlass)" stroke="#14161a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M103.4 15.8 L108.3 20.8 L104.8 21.1 L100.8 16.6 Z" fill="url(#pkGlass)" stroke="#14161a" stroke-width="1.6" stroke-linejoin="round"/>
