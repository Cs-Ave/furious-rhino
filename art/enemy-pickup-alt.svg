    <circle cx="103" cy="11" r="1.1" fill="#ffffff" opacity="0.9"/>
    <path d="M107.8 10.7 L110.6 10.7 M108.4 8.6 L110.2 8.6" fill="none" stroke="#9aa3ad" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
