  <path d="M12 22.4 L12 27 M21 22.4 L21 27 M30 22.4 L30 27 M39 22.4 L39 27 M48 22.4 L48 27 M57 22.4 L57 27 M66 22.4 L66 27 M73.5 22.4 L73.5 27" fill="none" stroke="#14161a" stroke-width="2.4"/>
  <path d="M12 22.4 L12 27 M21 22.4 L21 27 M30 22.4 L30 27 M39 22.4 L39 27 M48 22.4 L48 27 M57 22.4 L57 27 M66 22.4 L66 27 M73.5 22.4 L73.5 27" fill="none" stroke="#9aa38b" stroke-width="1.1"/>
  <!-- sirene ambar no teto (muda entre frames) -->
  <path d="M80.6 10.8 Q80.6 6.2 84 6.2 Q87.4 6.2 87.4 10.8 Z" fill="#8a5b1e" stroke="#14161a" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="82.7" cy="8" r="0.8" fill="#d9b088" opacity="0.3"/>
  <rect x="79.4" y="10.6" width="9.2" height="2.8" rx="1.2" fill="#262b34" stroke="#14161a" stroke-width="1.6"/>
