  <path d="M41.5 16.8 L46 19.5 L50.5 16.4 L48.9 15.3 L46 17.2 L43.1 15.4 Z" fill="#b3925c" stroke="#17171b" stroke-width="1.3" stroke-linejoin="round"/>
