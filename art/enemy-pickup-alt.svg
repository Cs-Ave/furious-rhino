  <path d="M83.5 20.9 L88.5 14 L91 14 L86 20.9 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M93.5 20.9 L98 15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
