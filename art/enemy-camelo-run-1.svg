<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 78" width="90" height="78">
  <!-- FURIOUS RHINO - v1.8.10. Frame B do camelo em disparada: pernas na
       fase oposta (as de tras avancam, as da frente recolhem) e a corcova
       1px mais baixa; pescoco, cabeca, sela e corpo IDENTICOS ao frame A
       (par: enemy-camelo.svg). -->
  <defs>
    <linearGradient id="cmB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a45f"/>
      <stop offset="1" stop-color="#b07f3e"/>
    </linearGradient>
  </defs>
  <!-- pernas de tras (fase B: recolhida / lancada a frente) -->
  <path d="M30 58 Q31 66 27 73" fill="none" stroke="#17171b" stroke-width="7" stroke-linecap="round"/>
  <path d="M30 58 Q31 66 27 73" fill="none" stroke="#96692f" stroke-width="4" stroke-linecap="round"/>
  <path d="M62 58 Q60 66 54 72" fill="none" stroke="#17171b" stroke-width="7" stroke-linecap="round"/>
  <path d="M62 58 Q60 66 54 72" fill="none" stroke="#96692f" stroke-width="4" stroke-linecap="round"/>
  <!-- rabo com pincel (abana 1px) -->
  <path d="M16 42 Q9 44 7 51" fill="none" stroke="#17171b" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M16 42 Q9 44 7 51" fill="none" stroke="#b07f3e" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="6.5" cy="52.5" r="3" fill="#7a5222" stroke="#17171b" stroke-width="1.6"/>
  <!-- corpo -->
  <ellipse cx="43" cy="52" rx="29" ry="18" fill="url(#cmB1)" stroke="#17171b" stroke-width="2.6"/>
  <!-- corcova balancando -->
  <path d="M28 42 Q40 15 56 40 Q47 35 42 35 Q35 35 28 42 Z" fill="url(#cmB1)" stroke="#17171b" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M34 33 Q41 25 49 32" fill="none" stroke="#e8c288" stroke-width="2.2" stroke-linecap="round"/>
  <!-- barriga clara -->
  <path d="M22 58 Q43 68 64 57" fill="none" stroke="#ecd2a2" stroke-width="4.5" stroke-linecap="round"/>
  <!-- pernas da frente (fase B) -->
  <path d="M40 62 Q42 68 48 73" fill="none" stroke="#17171b" stroke-width="7" stroke-linecap="round"/>
  <path d="M40 62 Q42 68 48 73" fill="none" stroke="#c68f47" stroke-width="4" stroke-linecap="round"/>
  <path d="M54 62 Q52 67 45 70" fill="none" stroke="#17171b" stroke-width="7" stroke-linecap="round"/>
  <path d="M54 62 Q52 67 45 70" fill="none" stroke="#c68f47" stroke-width="4" stroke-linecap="round"/>
  <!-- pescoco em S erguido -->
  <path d="M62 50 C70 46 70 36 69 28 L78 28 C80 38 78 50 68 56 Z" fill="url(#cmB1)" stroke="#17171b" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- cabeca bochechuda -->
  <ellipse cx="76" cy="24" rx="11" ry="9" fill="url(#cmB1)" stroke="#17171b" stroke-width="2.6"/>
  <path d="M84 27 Q88 28 88.5 31 Q85 32 82 30.5" fill="#c68f47" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- orelhinha e topete -->
  <path d="M70 16 Q68 12 72 10 Q74 13 73 16 Z" fill="#b07f3e" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M76 14 Q79 9 83 12 Q80 14 80 16" fill="#7a5222" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- olho grande de cilios pesados -->
  <circle cx="79" cy="22" r="3.4" fill="#ffffff" stroke="#17171b" stroke-width="1"/>
  <circle cx="80" cy="22.5" r="1.9" fill="#17171b"/>
  <circle cx="79.3" cy="21.6" r="0.7" fill="#ffffff"/>
  <path d="M75.5 18.5 Q78 17 81.5 18" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- narina e boca mastigando -->
  <circle cx="85" cy="23.5" r="0.9" fill="#17171b"/>
  <path d="M82 28 Q84.5 29.4 86.8 27.8" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- sela de tecido perdida da caravana -->
  <path d="M32 40 L52 40 L50 47 L34 47 Z" fill="#d6453c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M35 43.5 h13" fill="none" stroke="#ffd24a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="37" cy="49.5" r="1.6" fill="#ffd24a" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="47" cy="49.5" r="1.6" fill="#ffd24a" stroke="#17171b" stroke-width="0.9"/>
</svg>
