<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 50" width="76" height="50">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Zebra chibi (ver animal-zebra.svg) na pose de salto: corpo identico,
       pernas esticadas — traseiras para tras, dianteiras para frente. -->
  <defs>
    <linearGradient id="zb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e7"/>
      <stop offset="1" stop-color="#e9e2d2"/>
    </linearGradient>
  </defs>
  <!-- tail (erguida, tufo em gota) -->
  <path d="M9 26 Q4.5 22 5 15.5" fill="none" stroke="#17171b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M5 15.5 Q1.5 12 4 8.5 Q8 9.5 6.8 14 Q6.2 15.6 5 15.5 Z" fill="#17171b"/>
  <!-- legs (pose esticada no ar) -->
  <g transform="rotate(24 13.5 36)">
    <rect x="10.5" y="36" width="6" height="12.5" rx="2" fill="#f6f1e6" stroke="#17171b" stroke-width="2.2"/>
    <rect x="11.3" y="41.5" width="4.4" height="2.2" fill="#1f1f24"/>
    <rect x="11.1" y="45.6" width="4.8" height="3.2" rx="1.4" fill="#17171b"/>
  </g>
  <g transform="rotate(18 22.5 36)">
    <rect x="19.5" y="36" width="6" height="12.5" rx="2" fill="#e4ddcd" stroke="#17171b" stroke-width="2.2"/>
    <rect x="20.3" y="41.5" width="4.4" height="2.2" fill="#1f1f24"/>
    <rect x="20.1" y="45.6" width="4.8" height="3.2" rx="1.4" fill="#17171b"/>
  </g>
  <g transform="rotate(-18 36.5 36)">
    <rect x="33.5" y="36" width="6" height="12.5" rx="2" fill="#e4ddcd" stroke="#17171b" stroke-width="2.2"/>
    <rect x="34.3" y="41.5" width="4.4" height="2.2" fill="#1f1f24"/>
    <rect x="34.1" y="45.6" width="4.8" height="3.2" rx="1.4" fill="#17171b"/>
  </g>
  <g transform="rotate(-24 46.5 36)">
    <rect x="43.5" y="36" width="6" height="12.5" rx="2" fill="#f6f1e6" stroke="#17171b" stroke-width="2.2"/>
    <rect x="44.3" y="41.5" width="4.4" height="2.2" fill="#1f1f24"/>
    <rect x="44.1" y="45.6" width="4.8" height="3.2" rx="1.4" fill="#17171b"/>
  </g>
  <!-- body -->
  <ellipse cx="27" cy="32" rx="20" ry="11.5" fill="url(#zb2)" stroke="#17171b" stroke-width="2.8"/>
  <!-- body stripes (cunhas afuniladas penduradas do dorso) -->
  <path d="M11 24 Q10 30 12.5 36 Q14.8 35.6 15.8 34.6 Q13.4 29.5 14.6 23.4 Z" fill="#1f1f24"/>
  <path d="M19 21.6 Q18 28 20 35.8 Q22.6 35.4 23.6 34.4 Q21.6 28 22.8 21.2 Z" fill="#1f1f24"/>
  <path d="M27.5 20.8 Q26.8 27 28.6 34.2 Q31.2 33.8 32.2 32.8 Q30.4 27 31.4 20.8 Z" fill="#1f1f24"/>
  <path d="M35.8 21 Q35.2 25.5 36.6 30.2 Q39 29.8 40 28.8 Q38.6 25 39.4 21.4 Z" fill="#1f1f24"/>
  <!-- cabeca inteira deslocada para encaixar no corpo (sem vao) -->
  <g transform="translate(-1.5 1.5)">
  <!-- ears (grandes, com miolo creme-escuro) -->
  <path d="M46 8 Q43.5 1.5 50.5 3 Q53 7 49 10 Z" fill="#f6f1e6" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M47.3 7 Q46.3 4 49.4 4.8 Q50.4 6.6 48.6 8 Z" fill="#e0d9c8"/>
  <path d="M62.5 6.5 Q63 0.5 69.5 2.8 Q70.5 7 65.5 8.8 Z" fill="#f6f1e6" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M64.4 5.8 Q64.9 3 67.8 4 Q68.2 6 65.9 7 Z" fill="#e0d9c8"/>
  <!-- head (cabecona chibi) -->
  <ellipse cx="57" cy="18" rx="14" ry="13.5" fill="url(#zb2)" stroke="#17171b" stroke-width="2.8"/>
  <!-- nuca listrada + moicano -->
  <path d="M49.5 7.5 Q45 11 44 19 L47.5 18.5 Q48 12 52 8.2 Z" fill="#17171b"/>
  <path d="M46.5 12 L49 11.4 M45.8 15.5 L48.3 15" stroke="#f6f1e6" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M49.5 7.5 Q51 1.2 55 2.2 Q57 0.6 59 2.4 Q62.5 1.4 63.5 6.5 Q57 3.6 49.5 7.5 Z" fill="#17171b"/>
  <path d="M54 2.8 L54 5.6 M58 2.6 L58 5.2" stroke="#f6f1e6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- listras da testa e da bochecha -->
  <path d="M54.4 8.6 Q55.4 7.3 56.4 8.6 L56 12 Q55.4 11.5 54.8 12 Z" fill="#1f1f24"/>
  <path d="M58.6 8.4 Q59.6 7.2 60.6 8.5 L60 11.6 Q59.5 11.2 59 11.6 Z" fill="#1f1f24"/>
  <path d="M67.5 9.5 Q69.3 11.5 69.8 14" fill="none" stroke="#17171b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M68.9 16.5 Q69.6 18.2 69.4 20" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- olhos redondos grandes -->
  <circle cx="52" cy="15.5" r="2.7" fill="#17171b"/>
  <circle cx="63.5" cy="14.8" r="2.7" fill="#17171b"/>
  <circle cx="51.2" cy="14.7" r="0.85" fill="#ffffff"/>
  <circle cx="62.7" cy="14" r="0.85" fill="#ffffff"/>
  <!-- focinho escuro arredondado -->
  <ellipse cx="59.5" cy="25.8" rx="10" ry="6.8" fill="#3a3a41" stroke="#17171b" stroke-width="2.2"/>
  <circle cx="55" cy="24.6" r="1.4" fill="#18181d"/>
  <circle cx="62.5" cy="24.2" r="1.4" fill="#18181d"/>
  <path d="M54.5 29.5 Q59 31.8 63.5 29.3" fill="none" stroke="#1c1c21" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
