<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 32" width="56" height="32">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Arara vermelha chibi 56x32: identica ao frame base, asa para baixo. -->
  <defs>
    <linearGradient id="mc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5340"/>
      <stop offset="1" stop-color="#c9291c"/>
    </linearGradient>
  </defs>
  <!-- cauda longa (pena vermelha + pena azul) -->
  <path d="M15.5 14.5 L6.5 20 L14 21.5 Z" fill="#d33224" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15 18.5 L7.5 26 L15 24 Z" fill="#3f7cd6" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- corpo -->
  <ellipse cx="26" cy="18.5" rx="12.5" ry="9" fill="url(#mc)" stroke="#17171b" stroke-width="2.2"/>
  <ellipse cx="25.5" cy="24" rx="9" ry="3.5" fill="#b02318" opacity="0.6"/>
  <!-- asa abaixada (camadas vermelho > amarelo > azul) -->
  <path d="M22 20.5 Q16 30.5 30 29.5 Q34 25.5 28 18.5 Z" fill="#c9291c" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M23.5 21.3 Q19.5 26.5 24.5 29.1" fill="none" stroke="#f0b73a" stroke-width="2" stroke-linecap="round"/>
  <path d="M26.5 20.7 Q23 25.5 27.9 28.5" fill="none" stroke="#3f7cd6" stroke-width="2" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="39" cy="11.5" r="8" fill="#e8402f" stroke="#17171b" stroke-width="2.2"/>
  <path d="M33 6.5 Q38.5 2.5 44.5 6" fill="none" stroke="#c9291c" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  <!-- face branca + olho -->
  <ellipse cx="40.2" cy="10.6" rx="4.4" ry="3.9" fill="#f6f1e6"/>
  <path d="M38 8.9 Q40.2 8.3 42.4 8.9" fill="none" stroke="#d98a7e" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="40.2" cy="10.3" r="2.3" fill="#17171b"/>
  <circle cx="39.5" cy="9.6" r="0.75" fill="#ffffff"/>
  <!-- bicao curvo projetado para frente -->
  <path d="M42.8 7.2 Q49.2 6.5 50.8 9.9 Q51.9 12.2 49.8 14.8 Q48.7 16.1 47.6 15.5 Q48.9 13.1 47.6 11.2 Q46 9.6 42.9 10.6 Z" fill="#f5c033" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44.1 8 Q48.4 7.5 49.9 9.9" fill="none" stroke="#d9a01e" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M42.9 11.2 Q46.5 11.3 48 13.6 Q48.7 15 47.5 15.9 Q44.4 15.7 42.9 13.5 Z" fill="#3a3a41" stroke="#17171b" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
