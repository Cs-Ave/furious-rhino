<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 32" width="56" height="32">
  <!-- FURIOUS RHINO v1.4.0 - proposta "cartoon rico" (em avaliacao, nao usada pelo jogo).
       Coruja chibi 56x32, agora de PERFIL (olhando para onde voa), olho sem contorno
       pesado. A variante -flap so muda a asa. -->
  <defs>
    <linearGradient id="ow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b28249"/>
      <stop offset="1" stop-color="#8a5f2c"/>
    </linearGradient>
  </defs>
  <!-- cauda em leque curto -->
  <path d="M15.5 14 L8 16.5 L14.5 19 Z" fill="#8a5f2c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15.3 17 L7.5 21.5 L14.7 21 Z" fill="#7c5526" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- corpo -->
  <ellipse cx="26" cy="18.5" rx="12.5" ry="9" fill="url(#ow)" stroke="#17171b" stroke-width="2.2"/>
  <!-- barriga creme com escamas -->
  <ellipse cx="28" cy="21.5" rx="7.5" ry="4.8" fill="#f2e4c8"/>
  <path d="M24 20 Q26 22 28 20 M28 20 Q30 22 32 20" fill="none" stroke="#c9a86a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M26 23.5 Q28 25.5 30 23.5" fill="none" stroke="#c9a86a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- asa levantada -->
  <path d="M22 15 Q16 3.5 30 5 Q34 9 28 16 Z" fill="#7c5526" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 13.5 Q20.5 8.5 25.5 6.4" fill="none" stroke="#a8783f" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M27 13.8 Q24.5 9 29 6.8" fill="none" stroke="#a8783f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- tufos de orelha + cabeca -->
  <path d="M32.3 5.2 Q31.1 1.2 34.9 2.8 Q34.1 4.6 33.4 6 Z" fill="#8a5f2c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44.5 4.6 Q46.1 0.9 42.4 2.2 Q43.1 4.2 43.7 5.6 Z" fill="#8a5f2c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="39" cy="11.5" r="8.5" fill="url(#ow)" stroke="#17171b" stroke-width="2.2"/>
  <!-- disco facial de perfil + olho unico (sem contorno pesado) -->
  <ellipse cx="42.3" cy="11.8" rx="5.2" ry="5.8" fill="#f6ecd4" stroke="#17171b" stroke-width="1.1"/>
  <path d="M39.8 6.9 Q42.6 5.9 45.2 7.1" fill="none" stroke="#6f4c1e" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="42.6" cy="11" r="3" fill="#f0c463"/>
  <circle cx="42.6" cy="11" r="1.9" fill="#17171b"/>
  <circle cx="41.9" cy="10.3" r="0.7" fill="#ffffff"/>
  <!-- bico em gancho apontando para frente -->
  <path d="M46.6 11.2 Q50.4 12 48.9 15 Q47.7 15.7 46.5 13.9 Z" fill="#f0b73a" stroke="#17171b" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
