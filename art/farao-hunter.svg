<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <!-- FURIOUS RHINO - v1.8.10, boss dos 4700m: o FARAO DE BRONZE. O
       Comandante da muralha de arenito, olhando para a ESQUERDA (de onde o
       rino vem). MESMO rig dos cacadores (64x72, pernas em y=52, tronco
       cx33 cy44, cabeca cx25 cy19 r11.5) — vestido de guardiao real:
       MASCARA DE ANUBIS dourada (orelhas de chacal, focinho fino), nemes
       azul/ouro, peitoral de bronze e o CAJADO-UAS na mao, em pe. Pose de
       VIGIA: cajado fincado, outra mao nas costas.
       Par com farao-hunter-aim.svg: pernas, tronco, nemes e mascara
       identicos; mudam bracos e cajado (na mira ele NIVELA o uas — a boca
       do feixe no canvas (5,30), contrato de HunterSniper.muzzle()). -->
  <defs>
    <linearGradient id="fhG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c25e"/>
      <stop offset="1" stop-color="#b8892e"/>
    </linearGradient>
  </defs>
  <!-- pernas com caneleiras de bronze -->
  <rect x="24.5" y="52" width="7.5" height="13" rx="3" fill="#a8762a" stroke="#17171b" stroke-width="2"/>
  <rect x="34" y="52" width="7.5" height="13" rx="3" fill="#c9963a" stroke="#17171b" stroke-width="2"/>
  <!-- sandalias -->
  <rect x="22.6" y="63.6" width="10" height="6" rx="2.4" fill="#6b4326" stroke="#4a2e16" stroke-width="1.8"/>
  <rect x="33.4" y="63.6" width="10" height="6" rx="2.4" fill="#8a5a33" stroke="#4a2e16" stroke-width="1.8"/>
  <path d="M27.5 63.8 L27.5 66.8 M38.5 63.8 L38.5 66.8" fill="none" stroke="#d9a441" stroke-width="1.2"/>
  <!-- saiote real plissado sobre as pernas -->
  <path d="M24 50 L42 50 L44 58 L22 58 Z" fill="#f4efe0" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M27 50.5 L26 57.5 M31 50.5 L31 57.5 M35 50.5 L36 57.5 M39 50.5 L41 57.5" fill="none" stroke="#c9b98e" stroke-width="1.2"/>
  <!-- tronco: peitoral de bronze -->
  <ellipse cx="33" cy="44" rx="13.5" ry="12" fill="url(#fhG)" stroke="#17171b" stroke-width="2.5"/>
  <ellipse cx="32" cy="50" rx="9.5" ry="4.6" fill="#8a6520" opacity="0.55"/>
  <path d="M22.5 39 Q33 33 43.5 38.5" fill="none" stroke="#f0d488" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- colar usekh em arcos + escaravelho de lapis -->
  <path d="M24 38.5 Q33 34.5 42 38.5" fill="none" stroke="#1e4b8f" stroke-width="3" stroke-linecap="round"/>
  <path d="M23.5 41.5 Q33 37.5 42.5 41.5" fill="none" stroke="#d6453c" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="33" cy="45.5" rx="3.4" ry="2.6" fill="#1e4b8f" stroke="#17171b" stroke-width="1.2"/>
  <path d="M33 43.2 v4.6 M30.4 45.5 h5.2" fill="none" stroke="#17171b" stroke-width="0.8"/>
  <!-- cinturao com fivela solar -->
  <rect x="22.5" y="52" width="21" height="4.2" rx="1.6" fill="#6b4326" stroke="#4a2e16" stroke-width="1.8"/>
  <circle cx="33" cy="54" r="2.2" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <!-- o CAJADO-UAS fincado, na mao da frente: haste + forquilha + a cabeca
       de Set estilizada no topo com o disco solar -->
  <g>
    <path d="M17 12 L17 66" fill="none" stroke="#17171b" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M17 12 L17 66" fill="none" stroke="#8a5a33" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M17 66 L13.5 70 M17 66 L20.5 70" fill="none" stroke="#8a5a33" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M17 12 Q12.5 10.5 11.5 6.5 Q14.5 4.5 18 6 Q20 7.5 19.5 10.5 Z" fill="#d9a441" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="12" cy="4.5" r="3.2" fill="#ffd24a" stroke="#17171b" stroke-width="1.4"/>
  </g>
  <!-- braco da frente segurando o cajado -->
  <path d="M25 40 Q20 44 18 49" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M25 40 Q20 44 18 49" fill="none" stroke="#c9963a" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="17.4" cy="50.5" r="2.9" fill="#c08850" stroke="#17171b" stroke-width="1.7"/>
  <path d="M15 49 L20 49 M15 52 L20 52" fill="none" stroke="#d9a441" stroke-width="1" stroke-linecap="round"/>
  <!-- braco de tras dobrado nas costas (pose de rei) -->
  <path d="M41 40.5 Q45 44 43.5 49" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M41 40.5 Q45 44 43.5 49" fill="none" stroke="#b8892e" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="43" cy="50.5" r="2.9" fill="#c08850" stroke="#17171b" stroke-width="1.7"/>
  <!-- MASCARA DE ANUBIS dourada olhando para a esquerda -->
  <circle cx="25" cy="19" r="11.5" fill="url(#fhG)" stroke="#17171b" stroke-width="2.5"/>
  <!-- focinho fino de chacal -->
  <path d="M15.5 21 Q9.5 21.5 6.5 24.5 Q9 27.5 13.5 27 Q17 26.5 18.5 24.5 Z" fill="#c9963a" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="7.8" cy="25.2" r="1.3" fill="#17171b"/>
  <!-- ORELHAS de chacal em pe -->
  <path d="M18 10 L14 0.8 L23 7 Z" fill="#c9963a" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 8.5 L28.5 -0.5 L35 7.5 Z" fill="#d9a441" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17.5 7.5 L16 3.5 M30 5.5 L30 2" fill="none" stroke="#1e4b8f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- olho de lapis da mascara (frio, sem pupila humana) -->
  <path d="M16 16.5 Q20 14.5 24 16.2 Q20.5 19 16 17.8 Z" fill="#1e4b8f" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="19.8" cy="16.8" r="1.2" fill="#7be0ff"/>
  <path d="M24 17.5 l3 1.4" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- listras do nemes descendo da mascara -->
  <path d="M31 10.5 Q36.5 13 36.5 20 Q36.5 26 33 29 L29.5 27 Q32.5 23 32 17 Z" fill="#1e4b8f" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32.8 13.5 Q34.8 17 34.4 21 M32.4 24.5 Q33.6 22 33.8 19" fill="none" stroke="#d9a441" stroke-width="1.5" stroke-linecap="round"/>
  <!-- uraeus na testa da mascara -->
  <path d="M22 8.5 Q21 5.5 24 5 Q26 6 25 8.8 Z" fill="#ffd24a" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
