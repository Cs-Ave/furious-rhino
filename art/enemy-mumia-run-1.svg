  </defs>
  <!-- tira solta esvoacando (fase B) -->
  <path d="M10 26 Q4 27 2 32" fill="none" stroke="#c2b28c" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 42 Q5 41 3 36" fill="none" stroke="#c2b28c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- perna de tras (fase B: dando o passo) -->
