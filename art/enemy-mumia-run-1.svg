<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 66" width="46" height="66">
  <!-- FURIOUS RHINO - v1.8.10. Frame B da mumia: pernas em fase oposta,
       bracos levemente alternados e a tira solta esvoacando noutra curva;
