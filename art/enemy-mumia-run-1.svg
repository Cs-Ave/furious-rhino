  <path d="M26 32 Q35 30.5 43 31.5" fill="none" stroke="#17171b" stroke-width="7" stroke-linecap="round"/>
  <path d="M26 32 Q35 30.5 43 31.5" fill="none" stroke="#d4c49e" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M42 29.5 q3.2 0.6 3.6 2.8 q-2.2 1.6 -4.2 0.7" fill="#d4c49e" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
