  <path d="M28 27 Q36 27.5 42 29.5" fill="none" stroke="#a89870" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M41 27.5 q3 0.5 3.4 2.6 q-2 1.6 -4 0.8" fill="#a89870" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
