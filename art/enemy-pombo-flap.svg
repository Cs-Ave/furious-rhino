<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 34" width="48" height="34">
  <defs>
  <!-- v1.12.3 "Farol": halo claro por fora da silhueta. O contorno preto
       dos sprites some contra a cidade noturna (contraste de borda medido:
       2,3-2,8 · aceite 3,0). Desenhado ATRÁS do conteúdo — a arte original
       passa intacta pelo feMerge, e a hitbox não muda. -->
  <filter id="rim" x="-14%" y="-14%" width="128%" height="128%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="rimD"/>
    <feFlood flood-color="#e6eef7" flood-opacity="0.85"/>
    <feComposite in2="rimD" operator="in" result="rimC"/>
    <feMerge><feMergeNode in="rimC"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
  <g filter="url(#rim)">
  <!-- FURIOUS RHINO - v1.8.7 D1. Pombo gordo, frame de batida: asa em fase
       ALTA; corpo, papo, rabo, cabeca e bico identicos ao enemy-pombo.svg. -->
  <g transform="scale(1 0.9444)">
  <path d="M9 18 L0 12 L2 19 L0 25 Z" fill="#59616b" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="22" cy="20" rx="15" ry="11" fill="#8a939f" stroke="#17171b" stroke-width="2.4"/>
  <ellipse cx="31" cy="23" rx="8" ry="7.5" fill="#aab2bc"/>
  <!-- asa em fase ALTA -->
  <path d="M14 17 Q14 4 30 2 Q23 10 24 16 Z" fill="#59616b" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="38" cy="12" r="6.5" fill="#8a939f" stroke="#17171b" stroke-width="2.2"/>
  <path d="M33 16 Q36 19 40 18" fill="none" stroke="#4e8c6a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M43.5 11 L48 12.5 L43.5 14 Z" fill="#f2a33c" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="39.5" cy="10.5" r="1.8" fill="#17171b"/>
  <circle cx="40.1" cy="9.9" r="0.6" fill="#ffffff"/>
  <path d="M20 30 L18 34 M24 31 L23 35" fill="none" stroke="#f2a33c" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</g>
</svg>
