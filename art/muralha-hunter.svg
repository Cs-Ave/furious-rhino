<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <!-- FURIOUS RHINO - v1.8.7, boss dos 2000m: o COMANDANTE da Operacao
       Muralha. Oficial no ninho da torre de holofote, olhando para a
       ESQUERDA (de onde o rino vem). MESMO rig do boss-hunter.svg (64x72,
       pernas em y=52, tronco cx33 cy44, cabeca cx25 cy19 r11.5) — recolor
       para o azul-viatura da barricada + QUEPE de oficial + MEGAFONE (a
       "arma" dele e a voz que coordena a operacao). Pose de VIGIA: megafone
       abaixado na mao, outra mao nas costas.
       Par com muralha-hunter-aim.svg: pernas, tronco, dragonas e quepe
       identicos; mudam bracos, megafone e rosto. Sem hitbox (o dano sai
       dos projeteis do BossFight). Boca do megafone na MIRA: canvas (5,30)
       — mesmo contrato de HunterSniper.muzzle(). -->
  <!-- pernas de oficial em sentido -->
  <rect x="24.5" y="52" width="7.5" height="13" rx="3" fill="#223a55" stroke="#17171b" stroke-width="2"/>
  <rect x="34" y="52" width="7.5" height="13" rx="3" fill="#2e4a6b" stroke="#17171b" stroke-width="2"/>
  <rect x="22.6" y="63.6" width="10" height="6" rx="2.4" fill="#14181d" stroke="#0d1013" stroke-width="1.8"/>
  <rect x="33.4" y="63.6" width="10" height="6" rx="2.4" fill="#1c2127" stroke="#0d1013" stroke-width="1.8"/>
  <!-- vinco vermelho da calca de gala -->
  <path d="M28.2 52.5 L28.2 64.5 M37.7 52.5 L37.7 64.5" fill="none" stroke="#ff4a5e" stroke-width="1.2"/>
  <!-- tronco: tunica azul-viatura -->
  <ellipse cx="33" cy="44" rx="13.5" ry="12" fill="#2e4a6b" stroke="#17171b" stroke-width="2.5"/>
  <ellipse cx="32" cy="50" rx="9.5" ry="4.6" fill="#1c2f45" opacity="0.55"/>
  <path d="M22.5 39 Q33 33 43.5 38.5" fill="none" stroke="#4a6a94" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- botoes dourados e faixa de condecoracoes -->
  <path d="M33 36 L33 52" fill="none" stroke="#1c2f45" stroke-width="1.6"/>
  <circle cx="33" cy="39" r="1.3" fill="#ffd24a" stroke="#17171b" stroke-width="0.8"/>
  <circle cx="33" cy="44" r="1.3" fill="#ffd24a" stroke="#17171b" stroke-width="0.8"/>
  <circle cx="33" cy="49" r="1.3" fill="#ffd24a" stroke="#17171b" stroke-width="0.8"/>
  <g stroke="#17171b" stroke-width="0.9">
    <rect x="36" y="39" width="4" height="3" fill="#ff4a5e"/>
    <rect x="40.5" y="39" width="4" height="3" fill="#4ad1ff"/>
    <rect x="36" y="43" width="4" height="3" fill="#ffd24a"/>
  </g>
  <!-- dragonas -->
  <rect x="21" y="35.5" width="8" height="4" rx="1.6" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <rect x="37" y="35.5" width="8" height="4" rx="1.6" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <!-- cinturao com fivela -->
  <rect x="22.5" y="52" width="21" height="4.2" rx="1.6" fill="#14181d" stroke="#0d1013" stroke-width="1.8"/>
  <rect x="30.8" y="52.4" width="4.6" height="3.4" rx="0.8" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <!-- MEGAFONE em DESCANSO na mao da frente, apontado para o chao -->
  <g>
    <path d="M20 56 L26 50" fill="none" stroke="#17171b" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M20 56 L26 50" fill="none" stroke="#8a939f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 56 L13 66 L23 62 Z" fill="#d6453c" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
    <ellipse cx="17.6" cy="64.6" rx="5.6" ry="2.6" fill="#f6f4ef" stroke="#17171b" stroke-width="1.4" transform="rotate(-52 17.6 64.6)"/>
    <rect x="23.5" y="49" width="5" height="4" rx="1.4" fill="#26262c" stroke="#17171b" stroke-width="1.2" transform="rotate(-45 26 51)"/>
  </g>
  <!-- braco da frente segurando o megafone -->
  <path d="M25 40 Q22 45 24 50" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M25 40 Q22 45 24 50" fill="none" stroke="#26415e" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="24.6" cy="51.4" r="2.9" fill="#eaa96f" stroke="#17171b" stroke-width="1.7"/>
  <!-- braco de tras dobrado nas costas (pose de comandante) -->
  <path d="M41 40.5 Q45 44 43.5 49" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M41 40.5 Q45 44 43.5 49" fill="none" stroke="#2e4a6b" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="43" cy="50.5" r="2.9" fill="#eaa96f" stroke="#17171b" stroke-width="1.7"/>
  <!-- orelha -->
  <circle cx="36.8" cy="20.5" r="2.7" fill="#eaa96f" stroke="#17171b" stroke-width="1.8"/>
  <!-- cabeca olhando para a esquerda -->
  <circle cx="25" cy="19" r="11.5" fill="#eaa96f" stroke="#17171b" stroke-width="2.5"/>
  <!-- cara fechada de comando: sobrancelha dura, bigode fino -->
  <path d="M14.8 14.2 L20.6 16.2" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29.8 15.6 L24.6 16.8" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18.2" cy="19" r="2.4" fill="#17171b"/>
  <circle cx="26" cy="19.2" r="2.4" fill="#17171b"/>
  <circle cx="18.9" cy="18.2" r="0.8" fill="#ffffff"/>
  <circle cx="26.7" cy="18.4" r="0.8" fill="#ffffff"/>
  <circle cx="20.8" cy="22.4" r="1.8" fill="#e09b63" stroke="#b5713c" stroke-width="1"/>
  <path d="M15 26 Q18 24.4 21 25.4 Q24 24.4 27 26" fill="none" stroke="#3a3a44" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M15.6 28.6 Q21 30.6 25.6 28.8" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- QUEPE de oficial: copa alta, aba dura e brasao -->
  <path d="M13 13.5 Q12 4 25 3.4 Q38 4 37 13.5 Q25 9.5 13 13.5 Z" fill="#223a55" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M12.5 13.8 Q25 9.6 37.5 13.8 L37.5 16.4 Q25 12.4 12.5 16.4 Z" fill="#14181d" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <ellipse cx="16.5" cy="15.9" rx="7.5" ry="2.6" fill="#14181d" stroke="#17171b" stroke-width="1.6"/>
  <path d="M25 5.4 L27.6 7 L26.8 10 L23.2 10 L22.4 7 Z" fill="#ffd24a" stroke="#17171b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M15 12.4 Q25 8.8 35 12.4" fill="none" stroke="#ff4a5e" stroke-width="1.4" stroke-linecap="round"/>
</svg>
