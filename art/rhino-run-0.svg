    <path d="M64 40 L72 58" stroke="#c9c9cd" stroke-width="10" stroke-linecap="round"/>
  <path d="M64 40 L72 58" stroke="#4a4a50" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.25"/>
  <rect x="67" y="55" width="10" height="7" rx="2" fill="#6b6b71"/><path d="M52 42 L44 56" stroke="#c9c9cd" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 42 L44 56" stroke="#4a4a50" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.25"/>
  <rect x="39" y="53" width="10" height="7" rx="2" fill="#6b6b71"/><path d="M30 40 L36 58" stroke="#c9c9cd" stroke-width="10" stroke-linecap="round"/>
  <path d="M30 40 L36 58" stroke="#4a4a50" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.25"/>
