    <!-- body -->
    <ellipse cx="44" cy="32" rx="32" ry="19" fill="#c9c9cd" stroke="#4a4a50" stroke-width="3"/>
    <ellipse cx="42" cy="40" rx="24" ry="10" fill="#e0e0e4"/>
