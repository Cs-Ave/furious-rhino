    <path d="M30 22 Q34 28 30 36" fill="none" stroke="#a8a8ae" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40 20 Q44 27 40 38" fill="none" stroke="#a8a8ae" stroke-width="2.5" stroke-linecap="round"/>
