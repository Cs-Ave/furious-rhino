<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <!-- FURIOUS RHINO - v1.8.5, boss 2: o CAPTURADOR.
       Agente de contencao urbana de pe na plataforma da barricada, olhando
       para a ESQUERDA (de onde o rino vem). MESMO rig do boss-hunter.svg
       (64x72, pernas em y=52, tronco cx33 cy44, cabeca r11.5) — muda a
       profissao: uniforme cinza-azulado com colete tatico, capacete de
       intervencao e um CANHAO DE REDES de cano largo e curto no lugar do
       rifle fino (a rede aparece na boca do cano). Pose de VIGIA: canhao
       em descanso, apontado para baixo-esquerda.
       Par com boss2-hunter-aim.svg: pernas, tronco, colete e capacete
       identicos; mudam bracos, canhao e rosto. Sem hitbox (o dano sai do
       projetil). Boca do canhao na MIRA: canvas (5,30) — mesmo contrato de
       HunterSniper.muzzle() do cacador do zoo. -->
  <defs>
    <linearGradient id="b2j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8098"/>
      <stop offset="1" stop-color="#455363"/>
    </linearGradient>
    <linearGradient id="b2k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6a7c"/>
      <stop offset="1" stop-color="#333d49"/>
    </linearGradient>
    <radialGradient id="b2f" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f8cfa4"/>
      <stop offset="1" stop-color="#eaa96f"/>
    </radialGradient>
  </defs>
  <!-- pernas de operacao, base firme -->
  <rect x="24.5" y="52" width="7.5" height="13" rx="3" fill="#3b4653" stroke="#17171b" stroke-width="2"/>
  <rect x="34" y="52" width="7.5" height="13" rx="3" fill="#485665" stroke="#17171b" stroke-width="2"/>
  <rect x="22.6" y="63.6" width="10" height="6" rx="2.4" fill="#23292f" stroke="#141a1f" stroke-width="1.8"/>
  <rect x="33.4" y="63.6" width="10" height="6" rx="2.4" fill="#2d343c" stroke="#141a1f" stroke-width="1.8"/>
  <!-- joelheiras -->
  <rect x="24.2" y="56.4" width="8" height="4.6" rx="2" fill="#5a6a7c" stroke="#17171b" stroke-width="1.2"/>
  <rect x="33.7" y="56.4" width="8" height="4.6" rx="2" fill="#5a6a7c" stroke="#17171b" stroke-width="1.2"/>
  <!-- tronco: uniforme cinza-azulado -->
  <ellipse cx="33" cy="44" rx="13.5" ry="12" fill="url(#b2j)" stroke="#17171b" stroke-width="2.5"/>
  <ellipse cx="32" cy="50" rx="9.5" ry="4.6" fill="#2f3a46" opacity="0.45"/>
  <!-- colete tatico com bolsos -->
  <path d="M24 36.5 Q33 33.4 42 36.5 L42.6 51.5 Q33 54.4 23.4 51.5 Z" fill="#56657a" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="25.6" y="41" width="7" height="6.4" rx="1.4" fill="#3b4653" stroke="#17171b" stroke-width="1.2"/>
  <rect x="34.4" y="41" width="7" height="6.4" rx="1.4" fill="#3b4653" stroke="#17171b" stroke-width="1.2"/>
  <path d="M33.4 36 L33.4 52.4" fill="none" stroke="#2f3a46" stroke-width="1.4" opacity="0.8"/>
  <!-- cargas de rede sobressalentes no peito (a "municao" que o jogador ve) -->
  <g stroke="#17171b" stroke-width="1">
    <rect x="26.2" y="37.2" width="5" height="3" rx="1.2" fill="#cfe0ee"/>
    <rect x="34.8" y="37.2" width="5" height="3" rx="1.2" fill="#cfe0ee"/>
  </g>
  <!-- radio no ombro -->
  <rect x="39.4" y="34.4" width="4.4" height="5.6" rx="1.4" fill="#2f3a46" stroke="#17171b" stroke-width="1.3"/>
  <path d="M43 34.6 L44.6 30.5" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cinto de servico -->
  <rect x="22.5" y="52" width="21" height="4.2" rx="1.6" fill="#23292f" stroke="#141a1f" stroke-width="1.8"/>
  <rect x="30.8" y="52.4" width="4.6" height="3.4" rx="0.8" fill="#9fb0c2" stroke="#17171b" stroke-width="1.2"/>
  <!-- CANHAO DE REDES em DESCANSO: cano largo para baixo-esquerda. O
       translate desce a arma para a linha do cinto (a MESMA do rifle em
       descanso do cacador do zoo) — em cima do colete ela viraria um borrao -->
  <g transform="translate(-3, 2.4)">
    <path d="M16.5 57.5 L38 48.6" fill="none" stroke="#17171b" stroke-width="9" stroke-linecap="round"/>
    <path d="M16.5 57.5 L38 48.6" fill="none" stroke="#5b6672" stroke-width="5.8" stroke-linecap="round"/>
    <path d="M18 55.6 L29 51" fill="none" stroke="#8b98a6" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- tambor da carga -->
    <circle cx="31.8" cy="51" r="3.8" fill="#3f4954" stroke="#17171b" stroke-width="1.6"/>
    <circle cx="31.8" cy="51" r="1.4" fill="#8fd0e8"/>
    <!-- coronha curta -->
    <path d="M38 48.6 L44.6 52.8 L41.8 55.4 L36.6 50.8 Z" fill="#39424c" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- boca larga com o rolo de REDE a mostra -->
    <ellipse cx="15.2" cy="58" rx="4.2" ry="5.4" fill="#22272d" stroke="#17171b" stroke-width="1.8" transform="rotate(-23 15.2 58)"/>
    <circle cx="15.2" cy="58" r="3.2" fill="#e6eef5" stroke="#17171b" stroke-width="1"/>
    <g fill="none" stroke="#7d8b99" stroke-width="0.8">
      <path d="M13 56.2 L17.4 59.8 M13 59.8 L17.4 56.2 M15.2 55.2 L15.2 60.8 M12.4 58 L18 58"/>
    </g>
    <circle cx="13.2" cy="55.6" r="0.9" fill="#2c3138"/>
    <circle cx="17.6" cy="60.4" r="0.9" fill="#2c3138"/>
  </g>
  <!-- bracos: mao da frente no cano, mao de tras na coronha -->
  <path d="M25 40 Q21 45 20.5 51.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M25 40 Q21 45 20.5 51.5" fill="none" stroke="#4f5f70" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="20.6" cy="53.6" r="3" fill="#7d8fa2" stroke="#17171b" stroke-width="1.7"/>
  <path d="M41 40.5 Q43.5 43.5 42.5 47.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M41 40.5 Q43.5 43.5 42.5 47.5" fill="none" stroke="#6d8098" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="42" cy="49" r="3" fill="#7d8fa2" stroke="#17171b" stroke-width="1.7"/>
  <!-- fone/protetor auricular -->
  <circle cx="36.6" cy="20.2" r="3.4" fill="#39424c" stroke="#17171b" stroke-width="1.8"/>
  <!-- cabeca olhando para a esquerda -->
  <circle cx="25" cy="19" r="11.5" fill="url(#b2f)" stroke="#17171b" stroke-width="2.5"/>
  <!-- jugular do capacete -->
  <path d="M14.8 21.8 Q17.6 27.4 24.4 27.6" fill="none" stroke="#2f3a46" stroke-width="1.8" stroke-linecap="round"/>
  <!-- microfone do fone -->
  <path d="M34.6 22.6 Q30.6 26.4 27.2 26.6" fill="none" stroke="#2f3a46" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="26.4" cy="26.7" r="1.4" fill="#2f3a46"/>
  <!-- cara de servico: sobrancelhas baixas, queixo firme -->
  <path d="M14.8 15.6 L20.6 17" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29.8 16.6 L24.6 17.6" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18.2" cy="20" r="2.4" fill="#17171b"/>
  <circle cx="26" cy="20.2" r="2.4" fill="#17171b"/>
  <circle cx="18.9" cy="19.2" r="0.8" fill="#ffffff"/>
  <circle cx="26.7" cy="19.4" r="0.8" fill="#ffffff"/>
  <circle cx="20.6" cy="23.2" r="1.7" fill="#e09b63" stroke="#b5713c" stroke-width="1"/>
  <path d="M16.4 26.6 Q20.6 25.4 24.6 26.4" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- barba por fazer (mancha, nao bigodao: nao e o veterano do zoo) -->
  <path d="M15.6 24.2 Q20.6 29.6 26.4 24.6 Q25.4 30 20.6 30.4 Q16.4 29.4 15.6 24.2 Z" fill="#3f4954" opacity="0.22"/>
  <!-- CAPACETE de intervencao: casco + aba dura sobre os olhos -->
  <path d="M13.3 17 Q13.3 4.4 25 4.4 Q36.7 4.4 36.7 17 Q25 13 13.3 17 Z" fill="url(#b2k)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M15.4 9.4 Q25 5.6 34.6 9.4" fill="none" stroke="#7d8d9e" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="24.6" cy="14.6" rx="13.2" ry="3.4" fill="#39424c" stroke="#17171b" stroke-width="2"/>
  <path d="M12.2 14.4 Q24.6 17.4 37 14.4" fill="none" stroke="#22282f" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <!-- brasao da contencao no casco -->
  <path d="M24.6 6.6 L28 8.6 L27.2 12.2 L22 12.2 L21.2 8.6 Z" fill="#cfe0ee" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M24.6 8.4 L24.6 11 M22.9 9.7 L26.3 9.7" fill="none" stroke="#39424c" stroke-width="1.1" stroke-linecap="round"/>
</svg>
