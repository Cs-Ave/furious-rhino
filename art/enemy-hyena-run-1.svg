<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 46" width="66" height="46">
  <!-- FURIOUS RHINO - proposta bioma savana (em avaliacao, nao usada pelo jogo).
       Hiena-malhada chibi: ombros altos e garupa caida (dorso inclinado), crina
       ericada em zigue-zague, manchas irregulares e risada com dentinhos.
       hitbox sugerida: 56x32 em offset 5,12.
       Entre frames as pernas trocam de fase e no frame -run-1 a mandibula inferior
       (grupo) ganha rotate(12 52.4 21) — cai com pivo na articulacao junto a bochecha,
       abrindo a boca na risada e revelando interior escuro e dentes; resto byte-identico. -->
  <defs>
    <linearGradient id="hyb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7a878"/>
      <stop offset="1" stop-color="#a08350"/>
    </linearGradient>
    <radialGradient id="hyf" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#d4b88c"/>
      <stop offset="1" stop-color="#b3925e"/>
    </radialGradient>
  </defs>
  <!-- cauda curta de tufo -->
  <path d="M12 25 Q6.5 22 7.5 16.5" fill="none" stroke="#5a3a10" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M12 25 Q6.5 22 7.5 16.5" fill="none" stroke="#b3925e" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="7.5" cy="14.5" r="3.2" fill="#4a3018" stroke="#5a3a10" stroke-width="1.8"/>
  <!-- pernas em passada (fase B) -->
  <g transform="rotate(-12 14 32)">
    <rect x="11" y="31" width="5.6" height="13.5" rx="2.4" fill="#a68a58" stroke="#5a3a10" stroke-width="1.8"/>
    <rect x="11.7" y="40.8" width="4.2" height="3.4" rx="1.6" fill="#7c6136"/>
  </g>
  <g transform="rotate(14 21 32)">
    <rect x="18" y="31" width="5.8" height="13.5" rx="2.4" fill="#c2a273" stroke="#5a3a10" stroke-width="1.8"/>
    <rect x="18.7" y="40.8" width="4.4" height="3.4" rx="1.6" fill="#8a6c3c"/>
  </g>
  <g transform="rotate(-10 45 27)">
    <rect x="42" y="26" width="6" height="18.5" rx="2.6" fill="#a68a58" stroke="#5a3a10" stroke-width="1.8"/>
    <rect x="42.8" y="41.2" width="4.4" height="3.4" rx="1.6" fill="#7c6136"/>
  </g>
  <g transform="rotate(12 51 27)">
    <rect x="48" y="26" width="6.2" height="18.5" rx="2.6" fill="#c2a273" stroke="#5a3a10" stroke-width="1.8"/>
    <rect x="48.8" y="41.2" width="4.6" height="3.4" rx="1.6" fill="#8a6c3c"/>
  </g>
  <!-- corpo inclinado: ombros altos na frente, garupa caida atras -->
  <g transform="rotate(-8 30 27)">
    <ellipse cx="30" cy="27" rx="19.5" ry="10.5" fill="url(#hyb)" stroke="#5a3a10" stroke-width="2.5"/>
    <ellipse cx="28" cy="31.5" rx="13" ry="4.8" fill="#8a6c3c" opacity="0.5"/>
    <path d="M15 23.5 Q28 15.5 43 20.5" fill="none" stroke="#dcc294" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- manchas irregulares -->
    <ellipse cx="18" cy="27" rx="2.3" ry="1.7" fill="#6b5230" transform="rotate(-15 18 27)"/>
    <ellipse cx="25" cy="23" rx="2" ry="1.5" fill="#6b5230" transform="rotate(20 25 23)"/>
    <ellipse cx="24.5" cy="30.5" rx="1.8" ry="1.4" fill="#6b5230" transform="rotate(10 24.5 30.5)"/>
    <ellipse cx="32.5" cy="26.5" rx="2.2" ry="1.6" fill="#6b5230" transform="rotate(-20 32.5 26.5)"/>
    <ellipse cx="31" cy="32.5" rx="1.7" ry="1.3" fill="#6b5230" transform="rotate(15 31 32.5)"/>
    <ellipse cx="38.5" cy="24" rx="1.9" ry="1.4" fill="#6b5230" transform="rotate(-10 38.5 24)"/>
  </g>
  <!-- orelhas redondas grandes -->
  <circle cx="43.5" cy="7" r="4" fill="#a68a58" stroke="#5a3a10" stroke-width="1.8"/>
  <circle cx="43.8" cy="7.4" r="2" fill="#6b5230"/>
  <circle cx="56" cy="6" r="4.2" fill="#c2a273" stroke="#5a3a10" stroke-width="1.8"/>
  <circle cx="56.2" cy="6.4" r="2.1" fill="#6b5230"/>
  <!-- crina ericada em zigue-zague do topo da cabeca ao meio do dorso -->
  <path d="M48 10 L44.5 3.8 L42.5 9 L38.5 5.5 L36.5 10.5 L32.5 7.5 L31 12.5 L27 10.5 L25.5 15.5 L21.5 14 L20.5 18.5 L17 17.5 L16.5 21.5 Q30 16.5 41 12.5 Q45.5 11.5 48 10 Z" fill="#4a3018" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- cabeca -->
  <circle cx="50" cy="15.5" r="9.5" fill="url(#hyf)" stroke="#5a3a10" stroke-width="2.5"/>
  <path d="M44 10.8 Q47 9.2 49.5 10.4 M52.5 10.2 Q55 9 57.5 10.6" fill="none" stroke="#8d5a1c" stroke-width="1.1" stroke-linecap="round"/>
  <!-- olhos -->
  <circle cx="47.5" cy="13.5" r="2.1" fill="#2e1d08"/>
  <circle cx="54.5" cy="13" r="2.1" fill="#2e1d08"/>
  <circle cx="48.2" cy="12.8" r="0.7" fill="#ffffff"/>
  <circle cx="55.2" cy="12.3" r="0.7" fill="#ffffff"/>
  <!-- focinho escuro -->
  <ellipse cx="57.5" cy="19.5" rx="7.5" ry="5.6" fill="#5c4326" stroke="#5a3a10" stroke-width="2"/>
  <ellipse cx="62.8" cy="17.6" rx="2.1" ry="1.7" fill="#2e1d08"/>
  <!-- risada: interior escuro e dentes de cima fixos na maxila -->
  <path d="M52.2 20.4 Q58 22.2 63.6 20 L63.4 23.6 Q57.6 25.8 52.6 22.6 Z" fill="#3a2410" stroke="#5a3a10" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M54.6 21.6 L55.5 23.4 L56.5 21.9 Z" fill="#ffffff"/>
  <path d="M58.2 22.1 L59.1 23.8 L60.1 22 Z" fill="#ffffff"/>
  <!-- mandibula inferior com dentinho (grupo movel entre frames) -->
  <g transform="rotate(12 52.4 21)">
    <path d="M52.2 20.8 Q58 22.6 63.6 20.4 Q63.2 25.4 57.8 26.2 Q53.6 25.4 52.2 20.8 Z" fill="#5c4326" stroke="#5a3a10" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M55.9 22.2 L56.8 20.7 L57.8 22.3 Z" fill="#ffffff"/>
  </g>
</svg>
