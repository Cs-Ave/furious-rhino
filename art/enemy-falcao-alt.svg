<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 36" width="62" height="36">
  <!-- FURIOUS RHINO - v1.8.10. Frame -alt do falcao: TELEGRAPH do zag — as
       asas FECHAM coladas ao corpo (pique de mergulho) e o corpo se
       afila; cabeca, mascara, colar e cauda IDENTICOS (par:
       enemy-falcao.svg). Pisca no flip do zig, como pipa/dronezig. -->
  <defs>
    <linearGradient id="fcB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a6b"/>
      <stop offset="1" stop-color="#3a2f4a"/>
    </linearGradient>
  </defs>
  <!-- cauda em leque com barras (fechada um ponto) -->
  <path d="M14 20 L3 22.5 L8 24 L6 27.5 L13 26 L13 29.5 L18 24.5 Z" fill="url(#fcB2)" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M7 23.5 l5 -1 M8 25.8 l5 -1.4" fill="none" stroke="#17171b" stroke-width="0.9" opacity="0.6"/>
  <!-- corpo afilado no pique -->
  <ellipse cx="31" cy="20" rx="17" ry="7.5" fill="url(#fcB2)" stroke="#17171b" stroke-width="2.2"/>
  <!-- ASAS FECHADAS coladas ao dorso (pontas cruzando sobre a cauda) -->
  <path d="M22 15 L44 13.5 L38 16.5 Z" fill="#3a2f4a" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M20 16.5 L10 19.5 L21 18.8 L14 22 L24 20.5 Z" fill="url(#fcB2)" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 14.5 L13 16 L25 17.2 Z" fill="#6b5a80" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- peito claro rajado -->
  <path d="M38 15 Q44 17 44.5 22 Q41 26 36 25.5 Q40 20 38 15 Z" fill="#e8ddc2" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M39.5 18 l3 0.6 M39 21 l3.4 0.4 M38 23.6 l3 0.2" fill="none" stroke="#8a7a5e" stroke-width="0.9" stroke-linecap="round"/>
  <!-- garras recolhidas -->
  <path d="M32 26.5 l4 2.2 M36 26 l3.6 2.2" fill="none" stroke="#e8c26a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- colar dourado de Horus -->
  <path d="M42 14 Q46 17 46.5 21.5" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="49" cy="13" r="7" fill="url(#fcB2)" stroke="#17171b" stroke-width="2.2"/>
  <!-- mascara malar + face clara -->
  <path d="M47 9 Q52.5 7.5 55.5 11 Q54 15.5 50.5 17.5 Q52 13 49.5 10.5 Z" fill="#e8ddc2" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M50 12 L49 17.8" fill="none" stroke="#17171b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- bico curto ganchudo -->
  <path d="M55 11.5 Q58.5 12 58.5 14.2 Q56 15.6 54 14.2 Z" fill="#e8c26a" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M57.4 14.9 q0.7 1 0.3 1.8" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- olho solar APERTADO no pique -->
  <circle cx="50.5" cy="11.5" r="2.7" fill="#ffd24a" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="51.2" cy="12" r="1.5" fill="#17171b"/>
  <circle cx="50.6" cy="11.2" r="0.5" fill="#ffffff"/>
  <path d="M47 8.2 L54 9.4" fill="none" stroke="#17171b" stroke-width="1.7" stroke-linecap="round"/>
  <!-- riscos de velocidade do pique -->
  <path d="M6 11 h9 M4 15 h8" fill="none" stroke="#c9b6d8" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
</svg>
