<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 46" width="68" height="46">
  <!-- FURIOUS RHINO - v1.8.10 E4/E5 (vale/necropole). CHACAL do deserto:
       saltador (molde do k9: jumpV -760 / 420ms). Pelagem PRETA de Anubis,
       orelhas enormes em pe, focinho fino, coleira dourada com pingente —
       o guardiao das tumbas em disparada. Corre para a DIREITA (o jogo
       espelha). Hitbox do spec: 54x32 offset 6,12 — focinho fora.
       Frame de estado (-air): salto esticado, pernas colhidas/lancadas
       (troca por estado, sem anim — como o k9). -->
  <defs>
    <linearGradient id="chB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3540"/>
      <stop offset="1" stop-color="#211d26"/>
    </linearGradient>
  </defs>
  <!-- rabo de ponta clara -->
  <path d="M12 22 Q4 24 2 31" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M12 22 Q4 24 2 31" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M4 28 Q2.5 30 2 31.5" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  <!-- pernas de tras (fase corrida) -->
  <path d="M18 32 Q13 37 9 42" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M18 32 Q13 37 9 42" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M24 33 Q26 38 30 42" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M24 33 Q26 38 30 42" fill="none" stroke="#3a3540" stroke-width="3.2" stroke-linecap="round"/>
  <!-- corpo esguio -->
  <path d="M12 24 Q14 15 26 14.5 L42 15.5 Q50 17 52 24 Q50 31 42 32.5 L24 32 Q14 31 12 24 Z" fill="url(#chB)" stroke="#17171b" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- peito claro de areia -->
  <path d="M42 18 Q48 20 49.5 25 Q47 30 42 30.5 Q45 24 42 18 Z" fill="#c9a468" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- pernas da frente -->
  <path d="M38 33 Q36 38 32 41.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M38 33 Q36 38 32 41.5" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M46 32 Q50 36 54 39" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M46 32 Q50 36 54 39" fill="none" stroke="#3a3540" stroke-width="3.2" stroke-linecap="round"/>
  <!-- coleira dourada com ankh -->
  <path d="M44 16 Q49 19 50 24" fill="none" stroke="#d9a441" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="50.5" cy="26.5" r="2.4" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <!-- cabeca de focinho fino -->
  <path d="M48 12 Q56 8.5 63 12.5 Q66.5 15 67 18.5 Q62 20.5 57 19.5 Q51 19 48 16 Z" fill="url(#chB)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ORELHAS enormes de chacal -->
  <path d="M50 11 L46.5 1 L54 8.5 Z" fill="#2e2a34" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M56 10 L55 0.5 L61.5 8.5 Z" fill="#3a3540" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M52 7.5 L50 3.5 M57.5 6.5 L56.5 3" fill="none" stroke="#c9a468" stroke-width="1.4" stroke-linecap="round"/>
  <!-- nariz e boca -->
  <circle cx="66" cy="17" r="1.5" fill="#17171b"/>
  <path d="M60 19.8 Q63 21 65.5 20" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- olho dourado raivoso -->
  <circle cx="56.5" cy="13.5" r="2.8" fill="#ffd24a" stroke="#17171b" stroke-width="1"/>
  <circle cx="57.3" cy="13.8" r="1.5" fill="#17171b"/>
  <circle cx="56.6" cy="13" r="0.55" fill="#ffffff"/>
  <path d="M53 10.6 L59 11.6" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
</svg>
