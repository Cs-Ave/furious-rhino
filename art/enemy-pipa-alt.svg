<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
  <!-- v1.12.3 "Farol": halo claro por fora da silhueta. O contorno preto
       dos sprites some contra a cidade noturna (contraste de borda medido:
       2,3-2,8 · aceite 3,0). Desenhado ATRÁS do conteúdo — a arte original
       passa intacta pelo feMerge, e a hitbox não muda. -->
  <filter id="rim" x="-14%" y="-14%" width="128%" height="128%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="rimD"/>
    <feFlood flood-color="#e6eef7" flood-opacity="0.85"/>
    <feComposite in2="rimD" operator="in" result="rimC"/>
    <feMerge><feMergeNode in="rimC"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
  <g filter="url(#rim)">
  <!-- FURIOUS RHINO - v1.8.7 D2. Pipa Cortante, frame ALT: a RABIOLA gira
       para o OUTRO lado (chicoteia para a direita-baixo) — telegraph
       diegetico de que o zigue vai virar zague. Losango, varetas e cara
       identicos ao enemy-pipa.svg. -->
  <path d="M28 40 L48 56" fill="none" stroke="#e8e9ec" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <!-- RABIOLA chicoteada para a direita-baixo -->
  <path d="M28 41 Q34 47 41 50 Q46 52 48 56" fill="none" stroke="#f6f4ef" stroke-width="1.8" stroke-linecap="round"/>
