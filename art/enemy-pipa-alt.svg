    <path d="M36 46 L42 43 L38 50 Z" fill="#ffd24a"/>
    <path d="M44 52 L50 49 L46 56 Z" fill="#4ad1ff"/>
  </g>
  <path d="M28 2 L50 21 L28 40 L6 21 Z" fill="#d6453c" stroke="#17171b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M28 2 L50 21 L28 21 Z" fill="#e8695c"/>
  <path d="M28 2 L28 40 M6 21 L50 21" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M28 2 L28 40 M6 21 L50 21" fill="none" stroke="#8a5a2e" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M19 16.5 L25 18.5" fill="none" stroke="#17171b" stroke-width="2" stroke-linecap="round"/>
  <path d="M37 16.5 L31 18.5" fill="none" stroke="#17171b" stroke-width="2" stroke-linecap="round"/>
