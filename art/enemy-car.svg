  <circle cx="96.2" cy="22" r="0.9" fill="#ffffff" opacity="0.95"/>
  <path d="M102 20.6 L104.6 19.4 M102.6 23 L105.4 23" stroke="#ffd75e" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
