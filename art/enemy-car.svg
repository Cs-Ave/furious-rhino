  <rect x="96.5" y="28.5" width="9.5" height="6.8" rx="2.6" fill="#9aa0ab" stroke="#14161a" stroke-width="2"/>
  <rect x="2" y="28.5" width="8" height="6.8" rx="2.6" fill="#9aa0ab" stroke="#14161a" stroke-width="2"/>
