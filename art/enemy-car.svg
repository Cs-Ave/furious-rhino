  <rect x="98" y="30.2" width="7" height="3.6" rx="0.8" fill="#d7dae0" stroke="#14161a" stroke-width="1.2"/>
  <!-- rodas -->
  <circle cx="26" cy="36.5" r="8" fill="#23262c" stroke="#14161a" stroke-width="2.4"/>
  <circle cx="26" cy="36.5" r="5.2" fill="#3a3e46"/>
  <circle cx="26" cy="36.5" r="4.6" fill="#c7ccd5" stroke="#2a2d33" stroke-width="1"/>
  <path d="M26 36.5 L26 32.5 M26 36.5 L29.8 35.3 M26 36.5 L28.35 39.75 M26 36.5 L23.65 39.75 M26 36.5 L22.2 35.3" stroke="#5a616e" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="26" cy="36.5" r="1.3" fill="#6a7180"/>
  <circle cx="84" cy="36.5" r="8" fill="#23262c" stroke="#14161a" stroke-width="2.4"/>
  <circle cx="84" cy="36.5" r="5.2" fill="#3a3e46"/>
  <circle cx="84" cy="36.5" r="4.6" fill="#c7ccd5" stroke="#2a2d33" stroke-width="1"/>
  <path d="M84 36.5 L84 32.5 M84 36.5 L87.8 35.3 M84 36.5 L86.35 39.75 M84 36.5 L81.65 39.75 M84 36.5 L80.2 35.3" stroke="#5a616e" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="84" cy="36.5" r="1.3" fill="#6a7180"/>
  <!-- para-lamas -->
  <path d="M17.2 37 A8.8 8.8 0 0 1 34.8 37" fill="none" stroke="#14161a" stroke-width="2.6"/>
  <path d="M75.2 37 A8.8 8.8 0 0 1 92.8 37" fill="none" stroke="#14161a" stroke-width="2.6"/>
