<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <g opacity="1">
    <!-- ears -->
    <ellipse cx="11" cy="11" rx="8" ry="9" fill="#a8a8ae" stroke="#4a4a50" stroke-width="2.5"/>
    <ellipse cx="49" cy="11" rx="8" ry="9" fill="#a8a8ae" stroke="#4a4a50" stroke-width="2.5"/>
    <ellipse cx="11" cy="12" rx="3.5" ry="4.5" fill="#9a9aa0"/>
    <ellipse cx="49" cy="12" rx="3.5" ry="4.5" fill="#9a9aa0"/>
    <!-- head -->
    <path d="M8 22 Q8 8 30 8 Q52 8 52 22 L52 36 Q52 44 44 46 L16 46 Q8 44 8 36 Z"
          fill="#c9c9cd" stroke="#4a4a50" stroke-width="3" stroke-linejoin="round"/>
    <!-- muzzle -->
    <path d="M14 38 Q14 30 30 30 Q46 30 46 38 L46 50 Q46 57 30 57 Q14 57 14 50 Z"
          fill="#e0e0e4" stroke="#4a4a50" stroke-width="3" stroke-linejoin="round"/>
    <!-- horn over the muzzle -->
    <path d="M25 36 L30 16 L35 36 Q30 40 25 36 Z" fill="#eae4d3" stroke="#4a4a50" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- nostrils -->
    <ellipse cx="22" cy="49" rx="4" ry="3" fill="#3a3a40"/>
    <ellipse cx="38" cy="49" rx="4" ry="3" fill="#3a3a40"/>
    <!-- angry V brows + eyes -->
    <path d="M10 22 L24 27" stroke="#4a4a50" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 22 L36 27" stroke="#4a4a50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="19" cy="28" r="3.5" fill="#ffffff" stroke="#4a4a50" stroke-width="1.5"/>
    <circle cx="41" cy="28" r="3.5" fill="#ffffff" stroke="#4a4a50" stroke-width="1.5"/>
    <circle cx="20" cy="29" r="1.8" fill="#cc2222"/>
    <circle cx="40" cy="29" r="1.8" fill="#cc2222"/>
  </g>
</svg>
