<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36" width="64" height="36">
  <!-- FURIOUS RHINO - proposta bioma aviario (em avaliacao, nao usada pelo jogo).
       Aguia de mergulho chibi planando: asas longas abertas com penas em dedos,
       cabeca creme, sobrancelha brava, bico amarelo curvo, garras recolhidas.
       hitbox sugerida: 44x18 em offset 12,10.
       Entre frames so as asas mudam (erguidas <-> abaixadas), como o par macaw/flap. -->
  <defs>
    <linearGradient id="egb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5a2b"/>
      <stop offset="1" stop-color="#6b3f1a"/>
    </linearGradient>
  </defs>
  <!-- asa distante erguida -->
  <path d="M36 15 Q26 5.5 13 3.5 Q6 3 2.5 5 L8.5 6.8 Q4.5 8 3 10 L10 10 Q7 12 6.5 14.5 L14 12.8 Q24 14.5 36 17 Z" fill="#6b3f1a" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cauda em leque curto -->
  <path d="M28 16.5 L15 13.5 L17 17 L13.5 19.5 L17 22 L14.5 25.5 L28 23.5 Z" fill="#6b3f1a" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 18 L17 16.2 M26 20 L15.5 19.7 M26 22 L17 23.6" fill="none" stroke="#4e2d10" stroke-width="1" stroke-linecap="round"/>
  <!-- corpo -->
  <ellipse cx="37" cy="20" rx="11.5" ry="7" fill="url(#egb)" stroke="#17171b" stroke-width="2.4"/>
  <ellipse cx="36" cy="23" rx="8" ry="3" fill="#4e2d10" opacity="0.5"/>
  <path d="M28 17 Q36 12.5 45 16" fill="none" stroke="#a06a35" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- asa proxima erguida (penas da ponta em dedos) -->
  <path d="M42 13.5 Q32 4.5 18 3 Q9 2.2 4 4.5 L11 6.5 Q6 7.8 3.5 10.2 L11.5 10.4 Q7.5 12.6 5.5 15.5 L13.5 13.8 Q10.5 16.5 9.5 19 Q21 19.5 33 18.2 Q41.5 17.4 42 13.5 Z" fill="url(#egb)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M38 15.5 Q28 10 17 8.5" fill="none" stroke="#5a3a10" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 17 Q27 13.5 18 12.8" fill="none" stroke="#5a3a10" stroke-width="1.1" stroke-linecap="round"/>
  <!-- garras amarelas recolhidas -->
  <rect x="39.5" y="25.5" width="4" height="3.4" rx="1.7" fill="#f0b73a" stroke="#17171b" stroke-width="1.6"/>
  <path d="M43.5 28.5 q1.8 0.6 1.6 2" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="44.5" y="24.8" width="3.6" height="3.2" rx="1.6" fill="#f0b73a" stroke="#17171b" stroke-width="1.6"/>
  <path d="M48 27.6 q1.7 0.5 1.5 1.9" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cabeca creme -->
  <circle cx="49.5" cy="13.5" r="6.6" fill="#f2e6c8" stroke="#17171b" stroke-width="2.4"/>
  <path d="M44 8.8 L46 11 L43.6 13 L46 15.2 L43.9 17.4 L45.8 18.8" fill="none" stroke="#6b3f1a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sobrancelha brava -->
  <path d="M47 8.6 L53.6 10.8" fill="none" stroke="#17171b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- olho -->
  <circle cx="51.5" cy="13" r="2.3" fill="#17171b"/>
  <circle cx="50.8" cy="12.3" r="0.7" fill="#ffffff"/>
  <!-- bico amarelo curvo -->
  <path d="M54.8 10.6 Q61 10.2 62.6 12.8 Q63.4 14.6 61.4 16.8 Q60.2 18 59.2 17.3 Q60.4 15.2 59.2 13.7 Q57.6 12.3 54.9 13.2 Z" fill="#f5c033" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M56 11.4 Q60 11.2 61.8 12.9" fill="none" stroke="#d9a01e" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M54.9 13.8 Q57.8 13.9 59 15.6 Q59.5 16.7 58.5 17.3 Q56.2 17 54.9 15.4 Z" fill="#3a3a41" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="56.2" cy="12" r="0.5" fill="#b57e12"/>
</svg>
