<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 64" width="44" height="64">
  <!-- FURIOUS RHINO - v1.8.7 D1-D2. REPORTER AFOBADA correndo atras do furo:
       blazer vermelho, saia escura, microfone ESTENDIDO A FRENTE — o mic e o
       braco ficam FORA da hitbox (como o chifre do rino). Corre para a
       DIREITA (o jogo espelha com setFlipX).
       Hitbox sugerida: 26x50 com offset 2,10 (microfone fora).
       Par: enemy-reporter-run-1.svg (pernas em fase trocada). -->
  <!-- perna de tras esticada -->
  <path d="M12 44 Q8 50 5 55" fill="none" stroke="#17171b" stroke-width="6" stroke-linecap="round"/>
  <path d="M12 44 Q8 50 5 55" fill="none" stroke="#e0b088" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="0" y="53" width="9" height="5" rx="2.2" fill="#d6453c" stroke="#17171b" stroke-width="1.6"/>
  <!-- perna da frente dobrada -->
  <path d="M18 45 Q22 50 23 56" fill="none" stroke="#17171b" stroke-width="6" stroke-linecap="round"/>
  <path d="M18 45 Q22 50 23 56" fill="none" stroke="#e0b088" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="20" y="56" width="9" height="5" rx="2.2" fill="#d6453c" stroke="#17171b" stroke-width="1.6"/>
  <!-- saia escura -->
  <path d="M9 40 Q15 44 22 41 L21 48 Q15 50 10 47 Z" fill="#26262c" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <!-- BLAZER vermelho -->
  <path d="M8 24 Q15 21 22 24 L23 42 Q15 45 7 42 Z" fill="#d6453c" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M15 24 L15 42" fill="none" stroke="#a82f24" stroke-width="1.6"/>
  <rect x="11" y="29" width="3" height="3" fill="#ffd24a"/>
  <!-- braco de tras segurando o fone -->
  <path d="M9 28 Q5 31 6 36" fill="none" stroke="#17171b" stroke-width="5" stroke-linecap="round"/>
  <path d="M9 28 Q5 31 6 36" fill="none" stroke="#a82f24" stroke-width="2.8" stroke-linecap="round"/>
  <!-- BRACO ESTENDIDO com o MICROFONE (tudo fora da hitbox) -->
  <path d="M20 27 Q28 26 33 28" fill="none" stroke="#17171b" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 27 Q28 26 33 28" fill="none" stroke="#d6453c" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="34" cy="28.5" r="2.6" fill="#e0b088" stroke="#17171b" stroke-width="1.5"/>
  <rect x="35" y="26.6" width="7" height="3.6" rx="1.6" fill="#26262c" stroke="#17171b" stroke-width="1.3"/>
  <circle cx="43" cy="28.4" r="3.4" fill="#59616b" stroke="#17171b" stroke-width="1.5"/>
  <path d="M41 26.6 L45 30.2 M41 30.2 L45 26.6" fill="none" stroke="#3a4048" stroke-width="0.8"/>
  <!-- cubo da emissora no mic -->
  <rect x="36" y="30.4" width="4.6" height="4" fill="#4ad1ff" stroke="#17171b" stroke-width="1.1"/>
  <!-- cabeca afobada -->
  <circle cx="15" cy="14" r="9.5" fill="#e0b088" stroke="#17171b" stroke-width="2.2"/>
  <!-- cabelo escuro no vento -->
  <path d="M8 8 Q10 2 17 3 Q24 3 24 10 Q24 14 22 17 Q23 11 19 9 Q13 7 10 12 Q8 14 4 13 Q6 10 8 8 Z" fill="#3a2c1e" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M4 13 Q0 16 1 21 Q4 19 6 16 Z" fill="#3a2c1e" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- olho arregalado no furo -->
  <circle cx="18" cy="13.5" r="3" fill="#ffffff" stroke="#17171b" stroke-width="1.2"/>
  <circle cx="19" cy="13.8" r="1.5" fill="#17171b"/>
  <path d="M14.5 10.5 L20 10" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- boca gritando a manchete -->
  <ellipse cx="20" cy="19" rx="2.6" ry="2" fill="#611e29" stroke="#17171b" stroke-width="1.2"/>
  <!-- brinco -->
  <circle cx="10.5" cy="18" r="1.4" fill="#ffd24a" stroke="#17171b" stroke-width="0.9"/>
</svg>
