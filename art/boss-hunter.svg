<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <!-- FURIOUS RHINO - proposta boss v1.7 (em avaliacao, nao usada pelo jogo).
       O CACADOR do portao-fortaleza: vigia chibi de pe na plataforma do topo
       do portao blindado, olhando para a ESQUERDA (de onde o rino vem).
       Casaco de caca marrom com bandoleira de dardos DOURADOS (a cor dos
       dardos do rifle em jogo), chapeu de couro de aba larga, bigodao grisalho
       e cara fechada. Rifle tranquilizante longo com luneta em DESCANSO,
       apontado para baixo-esquerda. Sem hitbox: o cacador fica fora de
       alcance por posicao (o dano dele sai pelos dardos do pool).
       Par com boss-hunter-aim.svg (pose de mira do telegraph): pernas,
       tronco, bandoleira e chapeu identicos; mudam bracos, rifle e rosto.
       Boca do rifle na MIRA: canvas (5,30) — contrato com HunterSniper.muzzle(). -->
  <defs>
    <linearGradient id="bhj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96713d"/>
      <stop offset="1" stop-color="#6d5026"/>
    </linearGradient>
    <linearGradient id="bhh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2e"/>
      <stop offset="1" stop-color="#5f3c1a"/>
    </linearGradient>
    <radialGradient id="bhf" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f8cfa4"/>
      <stop offset="1" stop-color="#eaa96f"/>
    </radialGradient>
  </defs>
  <!-- pernas firmes de sentinela -->
  <rect x="24.5" y="52" width="7.5" height="13" rx="3" fill="#4f4030" stroke="#17171b" stroke-width="2"/>
  <rect x="34" y="52" width="7.5" height="13" rx="3" fill="#5c4b38" stroke="#17171b" stroke-width="2"/>
  <rect x="22.6" y="63.6" width="10" height="6" rx="2.4" fill="#3a2c1a" stroke="#241a0e" stroke-width="1.8"/>
  <rect x="33.4" y="63.6" width="10" height="6" rx="2.4" fill="#463521" stroke="#241a0e" stroke-width="1.8"/>
  <!-- tronco do casaco de caca -->
  <ellipse cx="33" cy="44" rx="13.5" ry="12" fill="url(#bhj)" stroke="#17171b" stroke-width="2.5"/>
  <ellipse cx="32" cy="50" rx="9.5" ry="4.6" fill="#5a4120" opacity="0.5"/>
  <path d="M22.5 39 Q33 32.5 43.5 38.5" fill="none" stroke="#b98f52" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- gola de la -->
  <path d="M26 34.5 L33 38 L40 34.2 L38 33 L33 35.6 L28 33.2 Z" fill="#d9c9a8" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- bandoleira com dardos dourados (a municao que o jogador ve voando) -->
  <path d="M23 37.5 L43 51.5" fill="none" stroke="#3a2c1a" stroke-width="5" stroke-linecap="round"/>
  <path d="M23 37.5 L43 51.5" fill="none" stroke="#6b4a22" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#17171b" stroke-width="1">
    <rect x="26.4" y="38.4" width="3" height="6" rx="1.2" fill="#ffc84a" transform="rotate(35 27.9 41.4)"/>
    <rect x="31.4" y="41.8" width="3" height="6" rx="1.2" fill="#ffc84a" transform="rotate(35 32.9 44.8)"/>
    <rect x="36.4" y="45.2" width="3" height="6" rx="1.2" fill="#ffc84a" transform="rotate(35 37.9 48.2)"/>
  </g>
  <!-- cinto -->
  <rect x="22.5" y="52" width="21" height="4.2" rx="1.6" fill="#3a2c1a" stroke="#241a0e" stroke-width="1.8"/>
  <rect x="30.8" y="52.4" width="4.6" height="3.4" rx="0.8" fill="#d9b13a" stroke="#17171b" stroke-width="1.2"/>
  <!-- rifle em DESCANSO: cano para baixo-esquerda, coronha no quadril -->
  <g>
    <path d="M10 60.5 L40 47.5" fill="none" stroke="#17171b" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M10 60.5 L26 53.6" fill="none" stroke="#aab2bc" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M26 53.6 L40 47.5" fill="none" stroke="#a5691f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M40 47.5 L46 52.5 L43 54.5 L38.4 49.8 Z" fill="#6b4a22" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- luneta -->
    <rect x="26" y="49" width="8" height="3.4" rx="1.7" fill="#2c3138" stroke="#17171b" stroke-width="1.4" transform="rotate(-23 30 50.7)"/>
    <circle cx="12.5" cy="59.4" r="1.6" fill="#2c3138"/>
  </g>
  <!-- bracos: mao da frente no cano, mao de tras na coronha -->
  <path d="M25 40 Q21 45 20.5 51.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M25 40 Q21 45 20.5 51.5" fill="none" stroke="#7d5c2e" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="20.6" cy="53.6" r="2.9" fill="url(#bhf)" stroke="#17171b" stroke-width="1.7"/>
  <path d="M41 40.5 Q43.5 43.5 42.5 47.5" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M41 40.5 Q43.5 43.5 42.5 47.5" fill="none" stroke="#96713d" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="42" cy="49" r="2.9" fill="url(#bhf)" stroke="#17171b" stroke-width="1.7"/>
  <!-- orelha -->
  <circle cx="36.8" cy="20.5" r="2.7" fill="#eaa96f" stroke="#17171b" stroke-width="1.8"/>
  <!-- cabeca olhando para a esquerda -->
  <circle cx="25" cy="19" r="11.5" fill="url(#bhf)" stroke="#17171b" stroke-width="2.5"/>
  <!-- costeleta grisalha -->
  <path d="M35.5 14.5 Q36.6 18.5 35 22.5 Q32.8 19.5 33.6 14.8 Z" fill="#c9c9ce" stroke="#17171b" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- cara fechada de sentinela -->
  <path d="M14.8 14.2 L20.6 16.2" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29.8 15.6 L24.6 16.8" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18.2" cy="19" r="2.4" fill="#17171b"/>
  <circle cx="26" cy="19.2" r="2.4" fill="#17171b"/>
  <circle cx="18.9" cy="18.2" r="0.8" fill="#ffffff"/>
  <circle cx="26.7" cy="18.4" r="0.8" fill="#ffffff"/>
  <!-- cicatriz de veterano -->
  <path d="M30 21.6 L32.6 24.8 M30.6 24 L32.2 22.2" fill="none" stroke="#c98a5a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- nariz e BIGODAO grisalho -->
  <circle cx="20.8" cy="22.4" r="1.8" fill="#e09b63" stroke="#b5713c" stroke-width="1"/>
  <path d="M12.5 25.5 Q16 22.6 21 24.4 Q26 22.6 29.5 25.7 Q27.5 29.6 22.8 28.2 Q21 27.6 19.2 28.3 Q14.4 29.6 12.5 25.5 Z" fill="#d8d8dc" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15.5 25.6 Q18 24.4 20.8 25.2 M23 25.2 Q25.6 24.5 27 25.8" fill="none" stroke="#aeaeb4" stroke-width="1" stroke-linecap="round"/>
  <!-- chapeu de couro de aba larga -->
  <path d="M15 9.8 Q16 2 25 2 Q34 2 35 9.8 Z" fill="url(#bhh)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M16.2 9 Q25 6.6 33.8 9 L33.4 6.9 Q25 4.7 16.6 6.9 Z" fill="#8f2f26" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="25" cy="10.2" rx="14" ry="4.2" fill="url(#bhh)" stroke="#17171b" stroke-width="2.2"/>
  <path d="M13 10 Q25 13 37 10" fill="none" stroke="#4a2e12" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
