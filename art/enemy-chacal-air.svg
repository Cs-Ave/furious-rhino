<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 46" width="68" height="46">
  <!-- FURIOUS RHINO - v1.8.10. Frame de SALTO do chacal (airTexture, troca
       por estado como o k9): corpo esticado no arco, patas dianteiras
       lancadas a frente, traseiras colhidas atras, rabo reto de leme e
       orelhas rebatidas pelo vento; mesma paleta e coleira do frame de
       corrida (par: enemy-chacal.svg). -->
  <defs>
    <linearGradient id="chB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3540"/>
      <stop offset="1" stop-color="#211d26"/>
    </linearGradient>
  </defs>
  <!-- rabo reto de leme -->
  <path d="M12 26 Q6 26 1.5 24" fill="none" stroke="#17171b" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M12 26 Q6 26 1.5 24" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M4.5 24.8 Q2.5 24.4 1.5 24" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  <!-- pernas traseiras COLHIDAS -->
  <path d="M18 30 Q13 31 9 35" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M18 30 Q13 31 9 35" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M23 32 Q19 34 16 38" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M23 32 Q19 34 16 38" fill="none" stroke="#3a3540" stroke-width="3.2" stroke-linecap="round"/>
  <!-- corpo esticado no arco do salto -->
  <path d="M10 27 Q16 16 30 13.5 L46 13 Q54 14.5 56 21 Q54 27 46 28.5 L26 30 Q15 30 10 27 Z" fill="url(#chB2)" stroke="#17171b" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- peito claro -->
  <path d="M46 15.5 Q52 17.5 53.5 21.5 Q51 26 46 26.5 Q49 21 46 15.5 Z" fill="#c9a468" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- patas dianteiras LANCADAS a frente -->
  <path d="M44 27 Q52 27 58 25" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M44 27 Q52 27 58 25" fill="none" stroke="#2e2a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M46 30.5 Q54 31.5 61 30" fill="none" stroke="#17171b" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M46 30.5 Q54 31.5 61 30" fill="none" stroke="#3a3540" stroke-width="3.2" stroke-linecap="round"/>
  <!-- coleira dourada com ankh -->
  <path d="M46 14 Q51 16.5 52.5 21" fill="none" stroke="#d9a441" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="53" cy="23.5" r="2.4" fill="#ffd24a" stroke="#17171b" stroke-width="1.2"/>
  <!-- cabeca lancada, focinho a frente -->
  <path d="M52 10 Q60 6.5 66 10.5 Q67.5 12.5 67.5 15 Q62 17 57 16.5 Q53 16 52 13.5 Z" fill="url(#chB2)" stroke="#17171b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- orelhas REBATIDAS para tras -->
  <path d="M53 9 L45 4 L53.5 6.5 Z" fill="#2e2a34" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M58 8 L51 2 L59.5 5.5 Z" fill="#3a3540" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- nariz e boca aberta no salto -->
  <circle cx="66.3" cy="13.2" r="1.5" fill="#17171b"/>
  <path d="M60 16.6 Q63 18.2 65.8 16.8" fill="none" stroke="#17171b" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M61.5 17.6 l1.4 1.6" fill="none" stroke="#d6453c" stroke-width="1.3" stroke-linecap="round"/>
  <!-- olho dourado cravado no alvo -->
  <circle cx="57.5" cy="11.5" r="2.8" fill="#ffd24a" stroke="#17171b" stroke-width="1"/>
  <circle cx="58.3" cy="11.8" r="1.5" fill="#17171b"/>
  <circle cx="57.6" cy="11" r="0.55" fill="#ffffff"/>
  <path d="M54 8.8 L60 9.6" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- riscos de velocidade -->
  <path d="M8 15 h8 M5 20 h7" fill="none" stroke="#c9a468" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
</svg>
