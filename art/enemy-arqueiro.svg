<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64" width="52" height="64">
  <!-- FURIOUS RHINO - v1.8.10 E3+ (escavacao). ARQUEIRO do deserto: o
       ATIRADOR terrestre (molde da camionete: 1 flecha em range 650-880,
       telegraph 300ms, dartSpeed 640, cap 1). Guarda de nemes listrado
       azul/dourado, saiote branco, peitoral de bronze e ARCO na mao,
       avancando com a flecha ainda no tune. Anda para a DIREITA (o jogo
       espelha; a flecha do jogo e o arrow-projectile do pool). Hitbox do
       spec: 28x52 offset 8,10 — o arco estendido fica FORA da colisao.
       Frame -alt = TELEGRAPH: arco TENSO com corda puxada (nao e passada
       de corrida — sem anim). -->
  <defs>
    <radialGradient id="aqS" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#e0a878"/>
      <stop offset="1" stop-color="#c08850"/>
    </radialGradient>
  </defs>
  <!-- perna de tras -->
  <path d="M22 48 Q19 54 15 58" fill="none" stroke="#17171b" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 48 Q19 54 15 58" fill="none" stroke="#b57e48" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M12.5 57 L18 57 L18 60.5 L11 60.5 Z" fill="#8a5a33" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- perna da frente -->
  <path d="M28 48 Q31 54 35 57" fill="none" stroke="#17171b" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 48 Q31 54 35 57" fill="none" stroke="#d09860" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M33 55.5 L39.5 56.5 L39 60 L31.5 59.5 Z" fill="#8a5a33" stroke="#17171b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- saiote branco com barra dourada -->
  <path d="M17 38 L33 38 L36 50 L14 50 Z" fill="#f4efe0" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 47 L35.5 47" fill="none" stroke="#d9a441" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M25 38.5 L25 49" fill="none" stroke="#c9b98e" stroke-width="1.4" stroke-linecap="round"/>
  <!-- tronco com peitoral de bronze -->
  <ellipse cx="25" cy="32" rx="10.5" ry="9" fill="url(#aqS)" stroke="#17171b" stroke-width="2.4"/>
  <path d="M17 27.5 Q25 24 33 27.5 L33 32 Q25 29 17 32 Z" fill="#d9a441" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="25" cy="29.5" r="2" fill="#1e4b8f" stroke="#17171b" stroke-width="1"/>
  <!-- cinto -->
  <rect x="16.5" y="37" width="17" height="3.6" rx="1.4" fill="#8a5a33" stroke="#17171b" stroke-width="1.5"/>
  <!-- aljava nas costas com flechas -->
  <path d="M12 24 L17 40 L11.5 41 L7.5 26 Z" fill="#8a5a33" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M10 24 l-2 -5 M13 23.5 l-1 -5.5" fill="none" stroke="#6b4326" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8 19 l-1.6 -2.4 l3 0.6 Z M12 18 l-1 -2.8 l2.8 1 Z" fill="#d6453c" stroke="#17171b" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- braco de tras segurando a flecha junto ao quadril -->
  <path d="M20 34 Q17 38 18 42" fill="none" stroke="#17171b" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 34 Q17 38 18 42" fill="none" stroke="#b57e48" stroke-width="3" stroke-linecap="round"/>
  <circle cx="18.4" cy="43.2" r="2.5" fill="url(#aqS)" stroke="#17171b" stroke-width="1.5"/>
  <!-- o ARCO em descanso na mao da frente (fora da hitbox) -->
  <path d="M42 18 Q50 33 42 48" fill="none" stroke="#17171b" stroke-width="4" stroke-linecap="round"/>
  <path d="M42 18 Q50 33 42 48" fill="none" stroke="#8a5a33" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M42 18 L42 48" fill="none" stroke="#e8ddc2" stroke-width="1.2" stroke-linecap="round"/>
  <!-- braco da frente segurando o arco -->
  <path d="M31 32 Q37 32 41.5 33" fill="none" stroke="#17171b" stroke-width="5" stroke-linecap="round"/>
  <path d="M31 32 Q37 32 41.5 33" fill="none" stroke="#d09860" stroke-width="3" stroke-linecap="round"/>
  <circle cx="43.2" cy="33.2" r="2.6" fill="url(#aqS)" stroke="#17171b" stroke-width="1.5"/>
  <!-- cabeca com NEMES listrado -->
  <circle cx="27" cy="15" r="9.5" fill="url(#aqS)" stroke="#17171b" stroke-width="2.4"/>
  <!-- kohl no olho + olhar de sentinela -->
  <circle cx="31" cy="14" r="2.8" fill="#ffffff" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="31.8" cy="14.3" r="1.6" fill="#17171b"/>
  <circle cx="31.1" cy="13.5" r="0.6" fill="#ffffff"/>
  <path d="M33.5 16 l3 0.8" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27.5 11 L34 12" fill="none" stroke="#17171b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- nariz e boca seria -->
  <path d="M35 17.5 q1.4 0.8 0.6 2" fill="none" stroke="#a06a38" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M31.5 21 q2 0.8 3.8 -0.2" fill="none" stroke="#17171b" stroke-width="1.3" stroke-linecap="round"/>
  <!-- NEMES: pano listrado caindo dos lados -->
  <path d="M17.5 12 Q18 3.5 27 3 Q36 3.5 36.5 12 Q27 8.5 17.5 12 Z" fill="#1e4b8f" stroke="#17171b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17.5 12 Q14.5 20 15 28 L22 26 Q19.5 19 20.5 12.5 Z" fill="#1e4b8f" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20 6.8 Q27 4.6 34 6.8 M18.5 9.6 Q27 7 35.5 9.6" fill="none" stroke="#d9a441" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M17.6 16 q3 -1 4.4 -0.6 M16.6 20.5 q3 -1 4.6 -0.6 M15.8 24.8 q3 -1 4.8 -0.6" fill="none" stroke="#d9a441" stroke-width="1.6" stroke-linecap="round"/>
  <!-- uraeus na testa -->
  <path d="M27 3 Q26 0.5 28.5 0.5 Q30 1.5 29 3.4 Z" fill="#ffd24a" stroke="#17171b" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
