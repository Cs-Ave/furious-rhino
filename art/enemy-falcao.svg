<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 36" width="62" height="36">
  <!-- FURIOUS RHINO - v1.8.10 E4/E5 (vale/necropole). FALCAO DE HORUS: o
       voador ZIG do ceu do Vale (vy 280, banda 380-545). Dorso ardosia,
       peito claro rajado, mascara malar escura de falcao-peregrino e colar
       DOURADO — as asas abertas ficam FORA da colisao. Voa para a DIREITA
       (o jogo espelha). Hitbox do spec: 42x18 offset 8,10.
       Frame -alt = TELEGRAPH do zag (asas FECHAM num pique), piscado no
       flip como pipa/dronezig — nao e frame de corrida. -->
  <defs>
    <linearGradient id="fcB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a6b"/>
      <stop offset="1" stop-color="#3a2f4a"/>
    </linearGradient>
  </defs>
  <!-- asa de tras ABERTA (dedadas longas) -->
  <path d="M24 15 L4 3 L11 11 L2 10 L13 15 L6 17 L18 19 Z" fill="#3a2f4a" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- cauda em leque com barras -->
  <path d="M14 20 L2 24 L7 25 L4 29 L12 27 L11 31 L18 25 Z" fill="url(#fcB)" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M6 24.5 l5 -1.5 M7 27 l5 -2" fill="none" stroke="#17171b" stroke-width="0.9" opacity="0.6"/>
  <!-- corpo -->
  <ellipse cx="31" cy="20" rx="17" ry="8.5" fill="url(#fcB)" stroke="#17171b" stroke-width="2.2"/>
  <!-- peito claro rajado -->
  <path d="M38 14.5 Q44 17 44.5 22.5 Q41 26.5 36 26 Q40 20 38 14.5 Z" fill="#e8ddc2" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M39.5 18 l3 0.6 M39 21 l3.4 0.4 M38 24 l3 0.2" fill="none" stroke="#8a7a5e" stroke-width="0.9" stroke-linecap="round"/>
  <!-- asa da frente ABERTA -->
  <path d="M28 13 L12 1 L18 9 L10 7 L20 13 L13 14 L24 17 Z" fill="url(#fcB)" stroke="#17171b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- garras recolhidas -->
  <path d="M32 27.5 l4 2.5 M36 27 l3.6 2.4" fill="none" stroke="#e8c26a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- colar dourado de Horus -->
  <path d="M42 14 Q46 17 46.5 21.5" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  <!-- cabeca -->
  <circle cx="49" cy="13" r="7" fill="url(#fcB)" stroke="#17171b" stroke-width="2.2"/>
  <!-- mascara malar (a "lagrima" do peregrino) + face clara -->
  <path d="M47 9 Q52.5 7.5 55.5 11 Q54 15.5 50.5 17.5 Q52 13 49.5 10.5 Z" fill="#e8ddc2" stroke="#17171b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M50 12 L49 17.8" fill="none" stroke="#17171b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- bico curto ganchudo -->
  <path d="M55 11.5 Q58.5 12 58.5 14.2 Q56 15.6 54 14.2 Z" fill="#e8c26a" stroke="#17171b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M57.4 14.9 q0.7 1 0.3 1.8" fill="none" stroke="#17171b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- olho solar de Horus -->
  <circle cx="50.5" cy="11.5" r="2.7" fill="#ffd24a" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="51.2" cy="11.8" r="1.5" fill="#17171b"/>
  <circle cx="50.6" cy="11" r="0.55" fill="#ffffff"/>
  <path d="M47.5 8.6 L53.5 9.2" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
</svg>
