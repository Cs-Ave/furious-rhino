<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 32" width="52" height="32">
  <!-- FURIOUS RHINO - v1.8.10 E3+ (escavacao). ESCARAVELHO sagrado em
       disparada: o rasteiro mais RAPIDO do deserto (speed 210), pequeno e
       baixo — pulinho curto resolve. Casco verde-esmeralda iridescente com
       risco central, chifrinho de placa na cabeca, perninhas em corrida.
       Corre para a DIREITA (o jogo espelha). Hitbox do spec: 40x24
       offset 6,6.
       Entre frames (-run-1): so as perninhas trocam de fase e o brilho do
       casco desliza; casco e cabeca identicos. -->
  <defs>
    <linearGradient id="esB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae7a"/>
      <stop offset="1" stop-color="#1e6b4a"/>
    </linearGradient>
  </defs>
  <!-- perninhas (fase A) -->
  <path d="M12 24 Q8 27 4 28" fill="none" stroke="#17171b" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M20 26 Q18 29 14 31" fill="none" stroke="#17171b" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M30 26 Q32 29 36 30.5" fill="none" stroke="#17171b" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M38 24 Q42 26 46 26.5" fill="none" stroke="#17171b" stroke-width="3.4" stroke-linecap="round"/>
  <!-- casco (elitros) com risco central -->
  <ellipse cx="24" cy="16" rx="19" ry="12" fill="url(#esB)" stroke="#17171b" stroke-width="2.2"/>
  <path d="M22 5.5 Q20 16 22.5 27" fill="none" stroke="#17171b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- brilho iridescente (desliza entre frames) -->
  <path d="M10 11 Q16 6.5 24 6.5" fill="none" stroke="#8ae0b8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="13" cy="18" r="1.4" fill="#8ae0b8" opacity="0.8"/>
  <!-- pontinhos dourados do casco -->
  <circle cx="17" cy="13" r="1" fill="#ffd24a"/>
  <circle cx="28" cy="11" r="1" fill="#ffd24a"/>
  <circle cx="31" cy="19" r="1" fill="#ffd24a"/>
  <!-- cabeca com placa dentada (o "ancinho" do escaravelho) -->
  <circle cx="42" cy="17" r="7" fill="#2a7d58" stroke="#17171b" stroke-width="2.2"/>
  <path d="M46 10.5 L49.5 7.5 L48.5 11.5 L51.5 10 L49.5 13.5 L52 13.5 L49 16" fill="none" stroke="#17171b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olhos grandes -->
  <circle cx="41" cy="15.5" r="2.7" fill="#ffffff" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="46" cy="16.5" r="2.4" fill="#ffffff" stroke="#17171b" stroke-width="0.9"/>
  <circle cx="41.7" cy="16" r="1.5" fill="#17171b"/>
  <circle cx="46.6" cy="17" r="1.3" fill="#17171b"/>
  <circle cx="41.1" cy="15.2" r="0.55" fill="#ffffff"/>
  <circle cx="46.1" cy="16.2" r="0.5" fill="#ffffff"/>
  <!-- carranca decidida -->
  <path d="M38.5 12.8 L43 13.8" fill="none" stroke="#17171b" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M40 21.5 Q43 22.8 45.5 21.5" fill="none" stroke="#17171b" stroke-width="1.3" stroke-linecap="round"/>
  <!-- a bolota de escaravelho, empurrada a frente (rolando) -->
  <circle cx="50" cy="27" r="1.8" fill="#8a6a3c" stroke="#17171b" stroke-width="1"/>
</svg>
