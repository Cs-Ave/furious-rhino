    <rect x="26" y="30" width="11" height="4" rx="2" fill="#2b3039" stroke="#0f1015" stroke-width="1.4" transform="rotate(10 31.5 32)"/>
    <path d="M29.6 29.6 L29.4 33.4" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="26.8" cy="31.2" r="1.6" fill="#e0574a" stroke="#0f1015" stroke-width="1"/>
