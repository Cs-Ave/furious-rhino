    <rect x="31.4" y="42.6" width="3" height="6" rx="1.2" fill="#ffc84a" transform="rotate(35 32.9 45.6)"/>
    <rect x="36.4" y="46" width="3" height="6" rx="1.2" fill="#e0574a" transform="rotate(35 37.9 49)"/>
  </g>
