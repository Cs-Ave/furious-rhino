  <circle cx="16.8" cy="33.6" r="2.9" fill="#15161c" stroke="#0f1015" stroke-width="1.7"/>
  <path d="M41 40.8 Q39.5 39.8 37.8 39.3" fill="none" stroke="#0f1015" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M41 40.8 Q39.5 39.8 37.8 39.3" fill="none" stroke="#3b4050" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="36.6" cy="39.1" r="2.9" fill="#15161c" stroke="#0f1015" stroke-width="1.7"/>
