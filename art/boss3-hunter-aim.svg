  <path d="M35.1 16.3 Q36.5 21.1 34.7 25.9 Q31.9 22.5 32.9 16.7 Z" fill="#9aa0aa" stroke="#0f1015" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- olho da mira APERTADO + olho de apoio FECHADO -->
  <path d="M13.8 16 L20 18.4" fill="none" stroke="#0f1015" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="17.6" cy="20.8" r="2.6" fill="#0f1015"/>
  <circle cx="18.4" cy="20" r="0.9" fill="#ffffff"/>
  <path d="M24.2 21.2 Q26.4 22.4 28.6 21.2" fill="none" stroke="#0f1015" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M29.7 17.4 L24.4 18.9" fill="none" stroke="#0f1015" stroke-width="2.2" stroke-linecap="round"/>
  <!-- cicatriz -->
  <path d="M29.5 23.9 L32.5 27.7 M30.1 26.7 L31.9 24.5" fill="none" stroke="#b0503a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- nariz e barba cerrada comprimida na concentracao -->
  <circle cx="20.3" cy="24.9" r="1.8" fill="#d18a54" stroke="#a6663a" stroke-width="1"/>
  <path d="M12.3 27.7 Q15.5 24.9 20.4 26.7 Q25.3 24.9 28.7 27.9 Q29.1 32.7 23.9 34.1 Q18.5 34.9 14.1 31.7 Q12.2 30.2 12.3 27.7 Z" fill="#9aa0aa" stroke="#0f1015" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M14.9 27.9 Q17.5 26.7 20.3 27.5 M22.5 27.5 Q25.1 26.8 26.5 28.1" fill="none" stroke="#71767f" stroke-width="1" stroke-linecap="round"/>
  <path d="M17.1 31.3 Q20.7 32.6 24.5 31.1" fill="none" stroke="#71767f" stroke-width="1.1" stroke-linecap="round"/>
  <!-- chapeu (identico, acompanhando a cabeca) -->
  <path d="M13.9 12.1 Q14.9 3.9 24.5 3.9 Q34.1 3.9 35.1 12.1 Z" fill="url(#b3h2)" stroke="#0f1015" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M15.2 11.3 Q24.5 8.7 33.8 11.3 L33.4 9 Q24.5 6.7 15.6 9 Z" fill="#8c1f1a" stroke="#0f1015" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M24.5 7.7 L26 8.9 L25.4 10.7 L23.6 10.7 L23 8.9 Z" fill="#e0b24a" stroke="#0f1015" stroke-width="0.9" stroke-linejoin="round"/>
  <ellipse cx="24.5" cy="12.7" rx="15" ry="4.4" fill="url(#b3h2)" stroke="#0f1015" stroke-width="2.2"/>
  <path d="M11 12.5 Q24.5 15.9 38 12.5" fill="none" stroke="#0a0b0e" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M11.9 11.3 Q24.5 8.1 37.1 11.3" fill="none" stroke="#4a5164" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
