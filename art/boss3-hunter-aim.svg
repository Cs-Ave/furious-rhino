<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <!-- FURIOUS RHINO - v1.8.5, boss 3: o CACADOR-MOR em pose de MIRA
       (telegraph do rifle). Mesmo personagem do boss3-hunter.svg — pernas,
       abas do casacao, tronco, dragonas, bandoleira e chapeu identicos.
       Mudam: rifle ORNAMENTADO erguido ao ombro apontando para
       baixo-esquerda (boca do cano no canvas (5,30) — contrato com
       HunterSniper.muzzle()), lente da luneta acesa em VERMELHO, cabeca
       inclinada sobre a coronha com o olho de apoio fechado. -->
  <defs>
    <linearGradient id="b3j2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4050"/>
      <stop offset="1" stop-color="#1c1f28"/>
    </linearGradient>
    <linearGradient id="b3h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33363f"/>
      <stop offset="1" stop-color="#181a20"/>
    </linearGradient>
    <radialGradient id="b3f2" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#f0c096"/>
      <stop offset="1" stop-color="#d9945c"/>
    </radialGradient>
  </defs>
  <!-- pernas e botas (identicas ao frame de vigia) -->
  <rect x="24.5" y="52" width="7.5" height="13" rx="3" fill="#20232c" stroke="#0f1015" stroke-width="2"/>
  <rect x="34" y="52" width="7.5" height="13" rx="3" fill="#2a2e38" stroke="#0f1015" stroke-width="2"/>
  <rect x="22.6" y="63.6" width="10" height="6" rx="2.4" fill="#15161c" stroke="#0a0b0e" stroke-width="1.8"/>
  <rect x="33.4" y="63.6" width="10" height="6" rx="2.4" fill="#1c1e25" stroke="#0a0b0e" stroke-width="1.8"/>
